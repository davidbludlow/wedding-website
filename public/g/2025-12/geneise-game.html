<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-Player Water Bucket Challenge</title>
    <style>
        body {
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #000;
            font-family: Arial, sans-serif;
            flex-direction: column;
            color: white;
        }
        h1 {
            margin-bottom: 10px;
            color: #4FC3F7;
        }
        #games-container {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        canvas {
            background-color: #000;
            border: 2px solid #4FC3F7;
            box-shadow: 0 0 20px rgba(79, 195, 247, 0.5);
            display: block;
        }
        #info {
            margin-top: 15px;
            font-size: 16px;
            text-align: center;
            opacity: 0.8;
            max-width: 860px;
        }
    </style>
</head>
<body>
    <h1>Two-Player Water Bucket Challenge</h1>
    <div id="games-container">
        <canvas id="leftBoard" width="400" height="400"></canvas>
        <canvas id="rightBoard" width="400" height="400"></canvas>
    </div>
    <div id="info">Player 1 (Left screen): A = Left, D = Right, W = Pour (when full &amp; next to large bucket)<br>Player 2 (Right screen): ← = Left, → = Right, Enter = Pour (when full &amp; next to large bucket).<br>Fill 100% before 3:00!</div>

    <script>
        class Game {
            constructor(canvasId, controls) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext("2d");
                this.controls = controls;  // { left, right, pour } as key strings (lowercase)
                this.state = 'play';
                this.drops = [];
                this.confetti = [];
                this.keys = { left: false, right: false, pour: false };
                this.startTime = performance.now();
                this.lastTime = 0;

                // Game objects
                this.player = {
                    x: 150,
                    y: 355,
                    w: 50,
                    h: 40,
                    fill: 0,
                    capacity: 10
                };
                this.largeBucket = {
                    x: 305,
                    y: 320,
                    w: 80,
                    h: 60,
                    fill: 0,
                    capacity: 25
                };

                // Constants
                this.DROP_SPAWN_RATE = 2.5;
                this.PLAYER_SPEED = 350;
                this.TIME_LIMIT = 180;
                this.MAX_DROPS = 120;
                this.DROP_MIN_VY = 120;
                this.DROP_MAX_VY = 320;
                this.DROP_MAX_R = 12;
                this.DROP_MIN_R = 5;

                this.animate = this.animate.bind(this);
                requestAnimationFrame(this.animate);
            }

            isNearLarge() {
                return this.player.x + this.player.w > this.largeBucket.x &&
                       this.player.x < this.largeBucket.x + this.largeBucket.w;
            }

            pour() {
                this.largeBucket.fill += this.player.capacity;
                this.player.fill = 0;
                if (this.largeBucket.fill >= this.largeBucket.capacity) {
                    this.state = 'win';
                    this.spawnConfetti();
                }
            }

            spawnConfetti() {
                this.confetti = [];
                for (let i = 0; i < 150; i++) {
                    this.confetti.push({
                        x: Math.random() * 400,
                        y: Math.random() * 200,
                        vx: (Math.random() - 0.5) * 1000,
                        vy: (Math.random() - 0.5) * 600 - 200,
                        rot: 0,
                        rotSpeed: (Math.random() - 0.5) * 20,
                        life: 4 + Math.random() * 3,
                        size: 3 + Math.random() * 8,
                        color: `hsl(${Math.random() * 360}, 100%, 65%)`
                    });
                }
            }

            updateConfetti(dt) {
                for (let i = this.confetti.length - 1; i >= 0; i--) {
                    const c = this.confetti[i];
                    c.x += c.vx * dt;
                    c.y += c.vy * dt;
                    c.vy += 800 * dt;
                    c.rot += c.rotSpeed * dt;
                    c.life -= dt;
                    if (c.life <= 0) {
                        this.confetti.splice(i, 1);
                    }
                }
            }

            drawBucket(x, y, w, h, ratio) {
                this.ctx.save();
                this.ctx.translate(x, y);

                this.ctx.strokeStyle = ratio >= 1 ? '#FFD700' : '#4682B4';
                this.ctx.lineWidth = ratio >= 1 ? 6 : 4;
                this.ctx.strokeRect(0, 0, w, h);

                const fh = Math.max(0, Math.min(1, ratio) * (h - 6));
                const fillColor = ratio >= 1 ? '#FFFF99' : '#87CEEB';
                this.ctx.fillStyle = fillColor;
                this.ctx.shadowColor = fillColor;
                this.ctx.shadowBlur = 15;
                this.ctx.shadowOffsetY = 3;
                this.ctx.fillRect(6, h - fh - 3, w - 12, fh + 2);
                this.ctx.shadowBlur = 0;

                this.ctx.restore();
            }

            drawPlayer() {
                const cx = this.player.x + this.player.w / 2;

                this.ctx.fillStyle = '#FDBCB4';
                this.ctx.shadowColor = '#FDBCB4';
                this.ctx.shadowBlur = 12;
                this.ctx.shadowOffsetY = 3;
                this.ctx.beginPath();
                this.ctx.arc(cx, this.player.y - 32, 14, 0, Math.PI * 2);
                this.ctx.fill();
                this.ctx.shadowBlur = 0;

                this.ctx.fillStyle = 'black';
                this.ctx.beginPath();
                this.ctx.arc(cx - 6, this.player.y - 35, 2.5, 0, Math.PI * 2);
                this.ctx.fill();
                this.ctx.beginPath();
                this.ctx.arc(cx + 6, this.player.y - 35, 2.5, 0, Math.PI * 2);
                this.ctx.fill();

                this.ctx.fillStyle = '#8B4513';
                this.ctx.shadowColor = '#654321';
                this.ctx.shadowBlur = 5;
                this.ctx.shadowOffsetY = 2;
                this.ctx.fillRect(cx - 10, this.player.y - 22, 20, 28);
                this.ctx.shadowBlur = 0;

                this.drawBucket(this.player.x, this.player.y, this.player.w, this.player.h, this.player.fill / this.player.capacity);
            }

            drawLargeBucket() {
                this.drawBucket(this.largeBucket.x, this.largeBucket.y, this.largeBucket.w, this.largeBucket.h, this.largeBucket.fill / this.largeBucket.capacity);
            }

            drawDrops() {
                this.ctx.shadowColor = '#4FC3F7';
                this.ctx.shadowOffsetY = 4;
                for (let drop of this.drops) {
                    this.ctx.shadowBlur = 12 + drop.radius * 1.5;

                    this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                    this.ctx.lineWidth = 1 + drop.radius * 0.15;
                    this.ctx.beginPath();
                    this.ctx.arc(drop.x, drop.y, drop.radius, 0, Math.PI * 2);
                    this.ctx.stroke();

                    this.ctx.fillStyle = '#4FC3F7';
                    this.ctx.beginPath();
                    this.ctx.arc(drop.x, drop.y, drop.radius, 0, Math.PI * 2);
                    this.ctx.fill();
                }
                this.ctx.shadowBlur = 0;
                this.ctx.shadowOffsetY = 0;
            }

            drawConfetti() {
                for (let c of this.confetti) {
                    const alpha = c.life / 5;
                    this.ctx.save();
                    this.ctx.globalAlpha = alpha;
                    this.ctx.translate(c.x, c.y);
                    this.ctx.rotate(c.rot);
                    this.ctx.fillStyle = c.color;
                    this.ctx.shadowColor = c.color;
                    this.ctx.shadowBlur = 15;
                    this.ctx.fillRect(-c.size / 2, -c.size / 2, c.size, c.size);
                    this.ctx.shadowBlur = 0;
                    this.ctx.restore();
                }
            }

            drawUI() {
                const now = performance.now();
                const elapsed = (now - this.startTime) / 1000;
                const timeLeft = Math.max(0, this.TIME_LIMIT - elapsed);
                const totalSec = Math.floor(timeLeft);
                const mins = Math.floor(totalSec / 60);
                const secs = (totalSec % 60).toString().padStart(2, '0');
                const perc = Math.floor(Math.min(100, (this.largeBucket.fill / this.largeBucket.capacity) * 100));

                this.ctx.fillStyle = 'white';
                this.ctx.shadowColor = 'white';
                this.ctx.shadowBlur = 8;
                this.ctx.font = 'bold 28px Arial';
                this.ctx.textAlign = 'left';
                this.ctx.textBaseline = 'top';
                this.ctx.fillText(`${mins}:${secs}`, 12, 12);
                this.ctx.shadowBlur = 0;

                const percY = this.largeBucket.y + this.largeBucket.h + 12;
                this.ctx.font = 'bold 32px Arial';
                this.ctx.textAlign = 'center';
                this.ctx.textBaseline = 'top';
                this.ctx.shadowColor = 'white';
                this.ctx.shadowBlur = 12;
                this.ctx.fillStyle = perc >= 100 ? '#FFD700' : 'white';
                this.ctx.fillText(`${perc}%`, this.largeBucket.x + this.largeBucket.w / 2, percY);
                this.ctx.shadowBlur = 0;
            }

            drawWin() {
                const now = performance.now();
                const pulse = 1 + 0.4 * Math.sin(now / 120);
                const hue = (now / 25) % 360;
                this.ctx.save();
                this.ctx.translate(200, 190);
                this.ctx.scale(pulse, pulse);
                this.ctx.rotate(Math.sin(now / 250) * 0.03);
                this.ctx.font = 'bold 68px Arial';
                this.ctx.textAlign = 'center';
                this.ctx.textBaseline = 'middle';
                this.ctx.fillStyle = `hsl(${hue}, 100%, 70%)`;
                this.ctx.shadowColor = `hsl(${hue}, 100%, 50%)`;
                this.ctx.shadowBlur = 35;
                this.ctx.lineWidth = 5;
                this.ctx.strokeStyle = `hsl(${(hue + 30) % 360}, 100%, 75%)`;
                this.ctx.strokeText('YOU WIN!!!', 0, 0);
                this.ctx.fillText('YOU WIN!!!', 0, 0);
                this.ctx.restore();

                this.ctx.fillStyle = '#CCCCCC';
                this.ctx.shadowBlur = 0;
                this.ctx.font = 'bold 24px Arial';
                this.ctx.textAlign = 'center';
                this.ctx.textBaseline = 'top';
                this.ctx.fillText('Press F5 to play again!', 200, 330);
            }

            drawLose() {
                const perc = Math.floor((this.largeBucket.fill / this.largeBucket.capacity) * 100);

                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.92)';
                this.ctx.fillRect(0, 0, 400, 400);

                this.ctx.fillStyle = '#FF4444';
                this.ctx.shadowColor = '#FF4444';
                this.ctx.shadowBlur = 25;
                this.ctx.font = 'bold 60px Arial';
                this.ctx.textAlign = 'center';
                this.ctx.textBaseline = 'middle';
                this.ctx.fillText("TIME'S UP!", 200, 130);
                this.ctx.shadowBlur = 0;

                this.ctx.font = 'bold 52px Arial';
                this.ctx.fillText('You Lose!', 200, 210);

                this.ctx.fillStyle = 'white';
                this.ctx.font = 'bold 40px Arial';
                this.ctx.fillText(`Final: ${perc}%`, 200, 290);

                this.ctx.fillStyle = '#CCCCCC';
                this.ctx.font = 'bold 24px Arial';
                this.ctx.textBaseline = 'top';
                this.ctx.fillText('Press F5 to play again!', 200, 360);
            }

            updateGame(dt) {
                const now = performance.now();
                const elapsed = (now - this.startTime) / 1000;

                if (this.state === 'play') {
                    if (elapsed >= this.TIME_LIMIT) {
                        this.state = 'lose';
                        return;
                    }

                    if (this.keys.left) {
                        this.player.x = Math.max(0, this.player.x - this.PLAYER_SPEED * dt);
                    }
                    if (this.keys.right) {
                        this.player.x = Math.min(this.canvas.width - this.player.w, this.player.x + this.PLAYER_SPEED * dt);
                    }

                    if (Math.random() < this.DROP_SPAWN_RATE * dt) {
                        const vy = this.DROP_MIN_VY + Math.random() * (this.DROP_MAX_VY - this.DROP_MIN_VY);
                        const rFactor = (vy - this.DROP_MIN_VY) / (this.DROP_MAX_VY - this.DROP_MIN_VY);
                        const radius = this.DROP_MAX_R - rFactor * (this.DROP_MAX_R - this.DROP_MIN_R);
                        this.drops.push({
                            x: Math.random() * this.canvas.width,
                            y: -radius * 4,
                            vy: vy,
                            radius: radius
                        });
                    }

                    for (let i = this.drops.length - 1; i >= 0; i--) {
                        const drop = this.drops[i];
                        drop.y += drop.vy * dt;

                        if (drop.y > this.canvas.height + drop.radius * 2) {
                            this.drops.splice(i, 1);
                            continue;
                        }

                        if (drop.y + drop.radius >= this.player.y &&
                            drop.y - drop.radius <= this.player.y + this.player.h &&
                            drop.x + drop.radius >= this.player.x + 8 &&
                            drop.x - drop.radius <= this.player.x + this.player.w - 8) {
                            this.player.fill = Math.min(this.player.capacity, this.player.fill + 1);
                            this.drops.splice(i, 1);
                        }
                    }

                    while (this.drops.length > this.MAX_DROPS) {
                        this.drops.shift();
                    }
                } else if (this.state === 'win') {
                    this.updateConfetti(dt);
                }
            }

            draw() {
                const grad = this.ctx.createLinearGradient(0, 0, 0, this.canvas.height);
                grad.addColorStop(0, '#0a1428');
                grad.addColorStop(0.3, '#001122');
                grad.addColorStop(0.7, '#000011');
                grad.addColorStop(1, '#000000');
                this.ctx.fillStyle = grad;
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                if (this.state === 'play') {
                    this.drawDrops();
                }

                this.drawPlayer();
                this.drawLargeBucket();

                if (this.state === 'play') {
                    this.drawUI();
                }

                if (this.state === 'win') {
                    this.drawConfetti();
                    this.drawWin();
                } else if (this.state === 'lose') {
                    this.drawLose();
                }
            }

            animate(currentTime = 0) {
                const dt = Math.min(1 / 30, (currentTime - this.lastTime) / 1000);
                this.lastTime = currentTime;

                this.updateGame(dt);
                this.draw();

                requestAnimationFrame(this.animate);
            }
        }

        // Controls definition (all keys in lowercase for comparison)
        const leftControls = {   // Player 1 - Left screen
            left: 'a',
            right: 'd',
            pour: 'w'
        };
        const rightControls = {  // Player 2 - Right screen
            left: 'arrowleft',
            right: 'arrowright',
            pour: 'enter'
        };

        // Create the two independent games
        const leftGame = new Game('leftBoard', leftControls);
        const rightGame = new Game('rightBoard', rightControls);

        // Global keyboard handling
        document.addEventListener('keydown', (e) => {
            e.preventDefault();
            const key = e.key.toLowerCase();

            // Left game (Player 1)
            if (key === leftGame.controls.left) leftGame.keys.left = true;
            if (key === leftGame.controls.right) leftGame.keys.right = true;
            if (key === leftGame.controls.pour) {
                if (!leftGame.keys.pour && leftGame.state === 'play' && 
                    leftGame.player.fill >= leftGame.player.capacity && leftGame.isNearLarge()) {
                    leftGame.keys.pour = true;
                    leftGame.pour();
                }
            }

            // Right game (Player 2)
            if (key === rightGame.controls.left) rightGame.keys.left = true;
            if (key === rightGame.controls.right) rightGame.keys.right = true;
            if (key === rightGame.controls.pour) {
                if (!rightGame.keys.pour && rightGame.state === 'play' && 
                    rightGame.player.fill >= rightGame.player.capacity && rightGame.isNearLarge()) {
                    rightGame.keys.pour = true;
                    rightGame.pour();
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();

            // Left game
            if (key === leftGame.controls.left) leftGame.keys.left = false;
            if (key === leftGame.controls.right) leftGame.keys.right = false;
            if (key === leftGame.controls.pour) leftGame.keys.pour = false;

            // Right game
            if (key === rightGame.controls.left) rightGame.keys.left = false;
            if (key === rightGame.controls.right) rightGame.keys.right = false;
            if (key === rightGame.controls.pour) rightGame.keys.pour = false;
        });
    </script>
</body>
</html>
