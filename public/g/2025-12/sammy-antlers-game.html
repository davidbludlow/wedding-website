html,body{margin:0;padding:0;height:100%;background:#05060A;color:var(--textMain)}
[hidden]{display:none!important}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;
  font-family:"Crimson Pro","Iowan Old Style",Georgia,"Times New Roman",serif;background:var(--void)}
text{user-select:none;-webkit-user-select:none}
[data-hs]{cursor:pointer}
[data-hs]:hover{filter:drop-shadow(0 0 10px rgba(255,201,120,.55))}
.redui [data-hs]:hover{filter:drop-shadow(0 0 10px rgba(255,59,48,.55))}
.redui{--accent:var(--eyeRed)}
[data-choice]{cursor:pointer}
[data-choice] rect{fill:var(--slate);stroke:var(--textDim);stroke-width:1;transition:fill .15s,stroke .15s}
[data-choice] text{fill:var(--textMain);font-weight:600}
[data-choice]:hover rect{fill:var(--ash);stroke:var(--accent)}

.pair .halo{fill:url(#haloW)}
.pair .core{fill:var(--eyeWhite)}
.pair .pupil{fill:var(--void)}
.redworld .pair .halo,.seye .halo{fill:url(#haloR)}
.redworld .pair .core,.seye .core{fill:var(--eyeRed)}
.seye .pupil,.redworld .pair .pupil{fill:var(--void)}
.redworld .pupil{transform:scale(1.4)}
.pupil,.lids,.pair,.seye{transform-box:fill-box;transform-origin:center}
.lids{transition:transform .15s ease-in}

.flame{transform-box:fill-box;transform-origin:center bottom;animation:flick 1.8s ease-in-out infinite}
.flame.f2{animation-delay:.7s}
@keyframes flick{0%,100%{opacity:1;transform:scale(1)}25%{opacity:.85;transform:scale(.97)}
  55%{opacity:.95;transform:scale(1.03)}80%{opacity:.9;transform:scale(.98)}}
.fogr{animation:fogdrift 40s ease-in-out infinite alternate}
.fogr.f2{animation:fogdrift 55s ease-in-out infinite alternate-reverse}
@keyframes fogdrift{from{transform:translateX(-80px)}to{transform:translateX(80px)}}
.pulse{animation:pulsek 1.2s ease-in-out infinite}
@keyframes pulsek{0%,100%{opacity:1}50%{opacity:.25}}
.invglow{animation:invg 2s ease-in-out infinite}
@keyframes invg{0%,100%{filter:drop-shadow(0 0 2px rgba(255,201,120,.2))}50%{filter:drop-shadow(0 0 12px rgba(255,201,120,.8))}}
#deerBody{transform-box:view-box;transform-origin:800px 800px;animation:breathe 5.5s ease-in-out infinite alternate}
#deerBody.still{animation:none}
@keyframes breathe{from{transform:scale(1,1)}to{transform:scale(1.012,1.03)}}
#skullG{transform-box:fill-box;transform-origin:center 90%;transition:transform 4s ease-in-out}
#skullG.tilt{transform:rotate(3deg)}
#fade{transition:opacity .35s ease}
#fade.slow{transition-duration:1.2s}
#fade.instant{transition:none}
#white{transition:none}
#white.fading{transition:opacity 3s ease}
#sunset{transition:opacity 3.5s linear}
.eyefade{transition:opacity .9s ease}
.gfade{transition:opacity 2.5s ease}
.glowfade{transition:opacity 4s ease}
.tonefade{transition:opacity 2s ease}
@media (prefers-reduced-motion: reduce){
  .flame,.fogr,#deerBody,.invglow{animation:none}
}
#rotate{position:fixed;inset:0;display:none;place-items:center;text-align:center;
  background:#05060A;color:#D8D3C6;z-index:10;padding:0 2rem;
  font-family:"Crimson Pro","Iowan Old Style",Georgia,serif}
#rotate p{max-width:22rem;font-size:1.25rem;line-height:1.6;letter-spacing:.02em}
@media (orientation:portrait) and (max-height:820px){ #rotate{display:grid} }

<script>
'use strict';
/* ============================================================
   ANTLERS — a week at Harrow House
   A point-and-click horror game in one file.
   ============================================================ */

/* ---------------- STRINGS (all copy) ---------------- */
const S = {
INTRO_1:[`Harrow House has more rooms than a family needs. Yours is the smallest and the highest, and you like it that way.`,
`You are Elias Vane. You are nine. Your parents live here too, somewhere.`],
INTRO_2:[`“A boy can’t live indoors,” your father says, mostly to his newspaper.`,
`“Outside, Elias. Once a day. Once around the lawn,” your mother says. “Before dark, preferably.”`,
`That’s the whole rule. Outside, once a day.`,
`It has always seemed like a rule about you.`,
`It isn’t.`],

FRONTDOOR_D1_AM:[`Later. The lawn will keep.`],
FRONTDOOR_DUSK:[`Dinner first. Then outside. You always go outside.`],
FRONTDOOR_D7_DUSK:[`Not yet. The sun is still in the wood, and you want the light gone before you go out to it.`],
FRONTDOOR_D1_EARLY:[`You have only just come out. Once around the lawn, she said. You can give it that long.`],
NIGHT_REVISIT:[`They are where you left them. Every one of them, still looking.`],
INVKEY_LOOK:[`A small brass key. It fits one door in this house, and you know which.`],
FRONTDOOR_D1_LATE:[`Not again tonight.`],
BED_D1_MOM:[`You can’t sleep without telling someone.`],
BED_RULE:[`You haven’t been outside today. The rule is the rule.`],
BED_CURIOUS:[`You’ve already been out today. But you lie there thinking about the treeline. Maybe you do want to see it. You won’t sleep until you look.`],
BED_READ:[`You read until dinner.`],
BED_WAIT:[`You wait for dark.`],
TRAY_EAT:[`You eat on the stairs, listening to the house.`,
`By the time you finish the plate, the windows have gone black.`],
CLOCK_AM:[`You watch the light go long.`],
CLOCK_DUSK:[`You wait for dark.`],
CLOCK_N_EARLY:[`Past dark. Past late.`],
CLOCK_N_MID:[`The hands say fourteen minutes past seven. They said that this morning.`],
CLOCK_N_LATE:[`The hands are gone.`],

D1_WAKE:[`You wake because the sun found the gap in the curtains. The house is quiet the way big houses are quiet — not empty, just far apart.`],
D1_DINNER:[`Dinner is at six in the small dining room. Your mother asks what you did today. You say: reading. She says a boy can’t live on books, and looks at your father, and your father agrees from behind his newspaper.`,
`The rule gets said again. Outside, once a day. Before dark, preferably.`,
`You haven’t been yet.`],
N1_EYES:[`The sun is already sliding behind the Marrowood when you get to the lawn. You left it late. The grass goes grey while you stand on it.`,
`At the treeline: two small lights.`,
`Not lights. Eyes. One pair of eyes, white as the moon, not blinking.`,
`They are looking at you.`,
`They have maybe been looking at you for a while.`],
N1_MOM:[`“Mom. Mom. There’s something outside. It has eyes. White eyes. It was looking at me.”`,
`“Looking at you.”`,
`“From the trees. It’s still there. Come and see.”`,
`“All right. Show me.”`],
N1_MOM_LAWN:[`She stands on the lawn a long time with the porch light behind her, looking where you point.`,
`“There’s nothing there, Elias.”`,
`And she’s right. You look and look. The treeline is only trees.`,
`The white eyes aren’t there.`,
`“It was probably a deer,” she says. “They come up to the lawn sometimes.”`,
`She goes in. You look once more, just to be sure.`,
`Nothing.`,
`Nothing is sure.`],
D1_SLEEP:[`In bed, you decide your mother is right. It was probably a deer. Probably you just saw something.`,
`You believe it for almost the whole night.`],

D2_WAKE:[`Morning again. The room is bright and reasonable, and everything that lives in the dark seems silly in it.`,
`Almost everything.`,
`You could go out now, in the light. Then you wouldn’t have to see whether it came back.`],
D2_EARLY:[`You go out just after breakfast, into the flat safe middle of the day. The treeline is only trees.`,
`You stand on the lawn exactly as long as counts as outside. Then you go in.`,
`Rule kept. Nothing seen. That was the idea.`],
DN_EARLY:[`You go out into the flat safe middle of the day. The treeline is only trees.`,
`You stand on the lawn exactly as long as counts as outside. Then you go in.`],
D2_DINNER:[`The tray is outside your door at six. Cold chicken, bread, an apple cut in quarters the way you like it. Your mother’s footsteps are already on the stairs, going away.`,
`You eat at the window, watching the lawn stay empty.`],
D2_DINNER_LATEHINT:[`You meant to go out early, before dark. You didn’t.`],
N2_RETURN_EARLY:[`You went out early so you wouldn’t see it. Rule kept. That should be the end of it.`,
`But you’re at the door again with your hand on the latch, and it isn’t the rule that put you there.`,
`Maybe you did want to see it.`],
N2_RETURN:[`You’re at the door with your hand on the latch. Maybe you did want to see it.`],
N2_EYES:[`Two.`,
`Two pairs of eyes at the treeline, white, side by side, not blinking. Twice as many as yesterday.`,
`They don’t come closer. They don’t leave. They watch, and you watch back, until watching is the worst thing there is, and you go in.`],

D3_WAKE:[`You wake up doing arithmetic.`],
D3_LIBRARY_ENTRY:[`One book stands half-out from the shelf. It didn’t, yesterday.`],
D3_DINNER:[`Dinner comes. You don’t hear it come. The tray is just there, steam still on the soup, the hallway empty in both directions.`],
N3_EYES:[`Four pairs tonight. You count them twice.`,
`One, then two, then four. You are nine and you know what doubling is.`,
`You do the sum for tomorrow and put it away like a bad card.`],

D4_WAKE:[`Four, last night. You dreamed about the treeline, except in the dream it was closer to the house. You wake and check. It isn’t.`,
`You check twice.`],
D4_DINNER:[`There’s a note on the tray, in your mother’s hand: “Your father is away to the city until week’s end. Be good. Outside once a day.”`,
`His office door, when you pass it, seems to know he’s gone.`],
N4_EYES:[`Eight. Spread along the treeline now, like the wood has put up lanterns for something.`,
`None of them blink. You’ve watched for it. Not once. Not one.`],

D5_WAKE:[`Eight, last night. Today the house feels like it’s listening for the same thing you are.`],
D5_DINNER:[`You eat with your back to the window. It doesn’t help. A window has two sides, and you can feel which side you’re on.`],
D5_NOTE:[`Under the plate, a second note: “Working late. Do NOT go in your father’s office. — Mom”`],
N5_EYES:[`Sixteen.`,
`Some are high in the branches. Some are low to the ground — at the height of something small. Or something lying down.`,
`And one, far back, is above the trees. Higher than anything that stands on legs. You decide it’s the moon in a wet branch.`,
`You decide it twice.`],
N5_RHYME:[`You counted them twice. The rhyme says not to.`,
`You wish you hadn’t.`],

D6_WAKE:[`Sixteen. You wake with the number already in your mouth.`,
`Thirty-two tonight. You know it like you know your own name.`],
D6_DINNER:[`The tray is there at six exactly. You open the door fast, to catch whoever brings it. The hall is empty in both directions. The soup is hot. Somebody was just here.`,
`You stand in the hall and call. The house swallows it.`],
N6_EYES:[`You stop counting at thirty-two, because at thirty-two you ran out of treeline. They stand two deep in places now, white on white in the dark. Some of them are on the lawn. Your lawn.`,
`The high one, the big one, is gone tonight. That is worse.`,
`Tomorrow: sixty-four. You do the sum the way you’d press on a bruise.`,
`Tomorrow there won’t be enough dark between them.`],

D7_WAKE:[`The seventh morning.`,
`The house is wrong in a way you can’t point at — quiet the way snow is quiet. You call for your mother and the hall takes your voice and doesn’t give anything back.`],
D7_WAKE_DREAM:[`You dreamed of the long dark shape above your father’s fireplace, and a drawer full of thunder.`],
D7_DINNER:[`Six o’clock. No tray.`,
`Seven. No tray, no footsteps, no mother, no house-sounds at all. The hall lights are on. You don’t remember them coming on.`,
`Through the window, the sun is lying down in the Marrowood.`,
`You haven’t been outside yet today.`,
`The rule is the rule.`],
D7_GUT:[`Something in your stomach says: don’t go out there empty-handed.`],
D7_WAVES:[`All of them. Everywhere. More than sixty-four.`,
`Numbers were for the other nights.`],
D7_RED:[`Red.`,
`Every one of them is red.`,
`They were never red before.`],
D7_DOOR:[`You turn for the house, and the house is there — the steps, the windows, the ivy.`,
`The door is not.`,
`Where the door should be there is brick, old brick, laid like a door was never in the whole idea of the house. You put your hands on it.`,
`The brick doesn’t care.`],
D7_TURN:[`You turn back around, because there is nowhere else to face.`,
`The lawn is gone. Harrow House is gone from behind you — you can feel it be gone, like a tooth.`,
`You are somewhere else. Somewhere the sky doesn’t reach. Trees, or the memory of trees, going up forever into a dark with no stars in it.`,
`And all around you: the Herd.`,
`Their shapes won’t hold still. Like deer, if deer were a guess somebody made in the dark — too tall, legs with too many joints, backs like hills moving. You can’t make them out. You understand, calmly, the way you understand things in dreams, that you are not meant to.`],
D7_MARROW:[`In front of you, something enormous is lying down, the way a hill is lying down.`,
`A deer. It was a deer the way the county was once the sea.`,
`Its body is flesh. Its head is not. Its head is a skull, clean and pale as the moon the eyes used to be, and its antlers go up and up until you lose them in the dark.`,
`Set in the skull: seven eyes.`,
`All of them red. All of them on you.`,
`They have maybe been on you your whole life.`],

CLR_RING:[`Their shapes won’t hold still. You are not meant to make them out.`],
CLR_VOID:[`There is no direction that is back.`],
CHOICE_ARMED:[`Your hands remember what they’re carrying.`],
UNARMED_NONE:[`Your hands are empty. You put them in your pockets. Your pockets are empty too.`],
UNARMED_GUN:[`You raise your father’s shotgun. Both barrels.`,
`Click. Click.`,
`The shells are in a green box, in his office, in a house that has no door.`],
UNARMED_SHELLS:[`Your pocket is full of shells. They rattle like teeth.`,
`There is nothing to put them in.`],
ARMED_STOOD:[`The shotgun is in your hands. Your hands forget what it’s for.`],
DEATH_1:[`The deer rises.`,
`Rising takes a long time. There is a lot of it.`,
`The red eyes come down toward you like weather. The Herd closes, shapes without shapes, and the dark of the wood goes over you like water over a stone.`,
`It is very quiet, and then it is not anything.`],
DEATH_RETRY:[`You are in your bed. It is the seventh morning.`,
`You get one more.`],
SHOOT_1:[`You break the gun open the way you watched him do it, thumb two shells home, snap it shut. The sound of it closing is small and hard and yours.`,
`The seven eyes watch the barrels come up. Nothing in them is afraid. Nothing has ever needed them to be. That is what the eyes have been saying all week.`],
SHOOT_2:[`Both barrels.`,
`The sound is the biggest thing you have ever made.`],
SHOOT_3:[`The skull goes like ice on a pond. The eyes go out one at a time — six, five, four — the dark getting darker each time — three, two —`,
`The last eye stays on you a moment. Not angry. Interested.`,
`Then it closes, and it isn’t there. Like it was never there.`],
END_GOOD_1:[`When the last eye closes, the dark goes with it.`,
`Grass. Cold, wet, ordinary grass. The lawn. The Marrowood, being trees. Behind you, Harrow House — and the door, exactly where doors are.`,
`It’s dawn. The porch light is still on, and your mother is standing in it.`,
`“Elias? Have you been outside all this time?”`],
END_GOOD_2:[`You have. Once a day, every day. Just like you were told.`,
`You look at the treeline one more time, just to be sure.`,
`Nothing.`,
`Nothing is sure.`],

KEY_TAKE:[`“The Deer of the Northern Counties, Vol. II.” Hollowed out. Inside — a small brass key.`],
OFFICE_UNLOCK:[`The brass key turns. The door has always been locked. Now it isn’t.`],
OFFICE_LOCKED:[`Locked. It has always been locked.`],
OFFICE_ENTER:[`Your father’s office smells of pipe smoke and gun oil. A green lamp, a desk of ledgers, a folded map of the estate. You are not allowed in here when he’s home.`,
`He is not home.`],
GUN_LOOK:[`Above the fireplace, a cabinet with a glass front. In it: his shotgun. Side-by-side, walnut and steel, older than your father, older maybe than the house’s name.`,
`You have never been allowed to touch it. It has never needed saying.`],
GUN_HESITATE:[`Your hand is on the glass.`,
`If you take it down, there is no putting it back the same. Fathers know how a thing was left.`,
`At the treeline, tonight, there will be more.`],
GUN_TAKE:[`You take it down. It’s heavier than it looks. It doesn’t make you feel bigger. It makes you feel exactly the size you are.`],
GUN_GONE:[`Two small hooks where it hung. The cabinet holds its shape of nothing.`],
GUN_EXAMINE:[`You break it open the way you’ve watched him do. Empty. Both barrels, empty.`,
`A shotgun with no shells is a stick.`],
GUN_EXAMINE_FULL:[`Two shells, thumbed home. You snap it shut and hold it the way you’ve watched him hold it.`],
SHELLS_LOOK:[`In the bottom drawer of the desk, under the folded map: a green cardboard box, its corners gone soft with age. BUCKSHOT — 12 BORE.`,
`It’s heavier than it should be. It rattles.`],
SHELLS_HESITATE:[`Taking the gun felt like borrowing. This feels like meaning it.`,
`You stand there a while, being nine.`,
`Then you think about the counting.`],
SHELLS_TAKE:[`You take the box. The shells knock together inside, quietly, like something agreeing with you.`],
SHELLS_GONE:[`The drawer holds the folded map and nothing else now.`],
SHELLS_EXAMINE:[`Twelve shells. You will need two. You count them anyway. Counting is the only thing that’s yours.`],

BOOK_7:[`You take down the field guide, because it is the most reasonable book you own.`,
`It falls open to the deer. The page about eyeshine is gone — not torn out, just not there, like a door. In its place, soaked through four pages in a brown ink:`,
`WELL COUNTED.`,
`COME OUTSIDE.`]
};

const BOOKS = [null,
{title:`A Field Guide to the Deer of the Northern Counties`,
 text:`The red deer is the largest of our native beasts, and the shyest. It moves at dawn and dusk. At night its eye returns lanternlight and shines white — this is called eyeshine, and is no cause for alarm. A deer that stands and stares is only deciding whether to run.`},
{title:`Harrow House: An Account of the Estate and Grounds`,
 text:`…the wood has been called the Marrowood since at least 1734, when the third baronet’s men, cutting a boundary ditch, turned up bone in quantities “beyond any churchyard” — antler and skull, all of it deer, none of it whole. What herd died there, and why all together, the account does not say. No herd of such a size has been recorded in the county before or since.`},
{title:`Sayings and Rhymes of the County, Collected`,
 text:`One for a watcher, two for a watch, / four is the herd and eight is the wood; / by sixteen be home, be quiet, be good — / for what you count is counting you. — The children of the district sing this at dusk. None could tell the collector what it is they are counting, nor why it must never be counted twice.`},
{title:`The Diary of Thomas Harrow, Aged Ten, 1794`,
 text:`Grandfather says the wood must see me once a day, and so I am sent to the lawn each afternoon, rain or shine. He says it is an old arrangement, older than the house. Better it sees you on the grass, he says, than comes looking for you in the halls. I asked him what does the seeing. He would not say. After supper he went out himself and stood a long time facing the trees, and I am not to tell Mother.`},
{title:`Notes on Game, with Plates`,
 text:`…no charge of shot will stop a full stag unless it be placed to the skull, the gun held steady, and the range close, which wants more nerve than most gentlemen own. A last word: never fire upon eyeshine alone. A man who shoots at eyes cannot know what he is shooting, nor how much of it there is. — And beneath, in old pencil: both barrels. the skull. do not miss.`},
{title:`A Parish Book of the Marrowood`,
 text:`Before the parish there was the wood, and before the wood there was Old Marrow, king under the antlers, who wears no flesh upon his head, that nothing may stand between his eyes and what is his. The old families kept his observance: to be seen of him daily; to keep count of his herd; and never to bar a door against him, for a barred door he takes away entire. His eyes are pale while he counts. When the counting is done his eyes are red, and he comes to gather what he has counted.`}
];

  const live = {}; // named running voices
  function ensure(){
    if(ctx) { if(ctx.state!=='running'){ try{ ctx.resume(); }catch(e){} } return true; }
    try{
      ctx = new (window.AudioContext||window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = muted?0:1;
      lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=8000;
      /* gentle safety limiter: the blast and sting can sum past 1.0, and a clipped
         flaky audio path (VMs especially) turns that into crackle or dropouts */
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value=-12; comp.knee.value=20; comp.ratio.value=6;
      comp.attack.value=0.003; comp.release.value=0.25;
      master.connect(lp); lp.connect(comp); comp.connect(ctx.destination);
      /* some audio stacks wedge the context after a device hiccup; try to climb back */
      ctx.onstatechange = () => { if(ctx && ctx.state==='suspended'){ try{ ctx.resume(); }catch(e){} } };
      return true;
    }catch(e){ ctx=null; return false; }
  }
  /* every cue calls this first: no sound schedules into a context that is not running */
  function up(){ if(!ctx) return false; if(ctx.state!=='running'){ try{ ctx.resume(); }catch(e){} } return true; }
  function g(v){ const n=ctx.createGain(); n.gain.value=v; n.connect(master); return n; }
  function noiseBuf(sec){
    const b=ctx.createBuffer(1, ctx.sampleRate*sec, ctx.sampleRate);
    const d=b.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    return b;
  }
  function stopVoice(name, ramp=0.3){
    const v=live[name]; if(!v) return; delete live[name];
    try{
      v.gain.gain.cancelScheduledValues(ctx.currentTime);
      v.gain.gain.setValueAtTime(v.gain.gain.value, ctx.currentTime);
      v.gain.gain.linearRampToValueAtTime(0.0001, ctx.currentTime+ramp);
      (v.nodes||[]).forEach(n=>{ try{n.stop(ctx.currentTime+ramp+0.05);}catch(e){} });
      if(v.timer) clearInterval(v.timer);
    }catch(e){}
  }
  return {
    ensure,
    resume(){ if(ctx && ctx.state!=='running'){ try{ ctx.resume(); }catch(e){} } },
    get on(){ return !!ctx; },
    toggleMute(){ muted=!muted; if(master){ const t=ctx.currentTime;
      master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(master.gain.value,t);
      master.gain.linearRampToValueAtTime(muted?0:1, t+0.05);} return muted; },
    get muted(){ return muted; },
    wind(indoor){
      if(!up()) return;
      if(live.wind && live.wind.indoor===indoor) return;   /* same bed already playing: no restart, no pumping */
      stopVoice('wind',0.4);
      try{
        const src=ctx.createBufferSource(); src.buffer=noiseBuf(2); src.loop=true;
        const f=ctx.createBiquadFilter();
        if(indoor){ f.type='lowpass'; f.frequency.value=250; } else { f.type='bandpass'; f.frequency.value=400; f.Q.value=0.5; }
        const gn=g(0.0001);
        const lfo=ctx.createOscillator(); lfo.frequency.value=0.07;
        const lfoG=ctx.createGain(); lfoG.gain.value=indoor?0.012:0.03;
        lfo.connect(lfoG); lfoG.connect(gn.gain);
        src.connect(f); f.connect(gn);
        src.start(); lfo.start();
        const base=indoor?0.04:0.09;
        gn.gain.linearRampToValueAtTime(base, ctx.currentTime+2);
        live.wind={gain:gn,nodes:[src,lfo],base,indoor};
      }catch(e){}
    },
    windDuck(mult){ const v=live.wind; if(!v) return;
      try{ const t=ctx.currentTime;
        v.gain.gain.cancelScheduledValues(t);
        v.gain.gain.setValueAtTime(v.gain.gain.value,t);
        v.gain.gain.linearRampToValueAtTime((v.base||0.09)*mult, t+1.5);
      }catch(e){} },
    crickets(on){
      if(!up()) return;
      if(!on){ stopVoice('crickets',0.3); return; }
      if(live.crickets) return;
      try{
        const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=4300;
        const gate=ctx.createGain(); gate.gain.value=0;
        const lfo=ctx.createOscillator(); lfo.type='square'; lfo.frequency.value=12;
        const lg=ctx.createGain(); lg.gain.value=0.5;
        const off=ctx.createConstantSource(); off.offset.value=0.5;
        lfo.connect(lg); lg.connect(gate.gain); off.connect(gate.gain);
        const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=4300; f.Q.value=8;
        const gn=g(0.006);
        o.connect(gate); gate.connect(f); f.connect(gn);
        o.start(); lfo.start(); off.start();
        live.crickets={gain:gn,nodes:[o,lfo,off]};
      }catch(e){}
    },
    swell(freq, target){
      if(!up()) return;
      try{
        if(live.swell){
          live.swell.o1.frequency.linearRampToValueAtTime(freq, ctx.currentTime+2);
          live.swell.o2.frequency.linearRampToValueAtTime(freq+1.5, ctx.currentTime+2);
          live.swell.o3.frequency.linearRampToValueAtTime(freq*3, ctx.currentTime+2);
          live.swell.o4.frequency.linearRampToValueAtTime(freq*5, ctx.currentTime+2);
          live.swell.gain.gain.linearRampToValueAtTime(target, ctx.currentTime+8);
          return;
        }
        const o1=ctx.createOscillator(); o1.frequency.value=freq;
        const o2=ctx.createOscillator(); o2.frequency.value=freq+1.5;
        /* quiet upper partials: the 31-44Hz fundamentals do not exist on laptop or
           phone speakers, so without these the whole dread-drone is silent there */
        const o3=ctx.createOscillator(); o3.frequency.value=freq*3;
        const o4=ctx.createOscillator(); o4.frequency.value=freq*5;
        const gn=g(0.0001);
        const h3=ctx.createGain(); h3.gain.value=0.22;
        const h5=ctx.createGain(); h5.gain.value=0.15;
        o1.connect(gn); o2.connect(gn);
        o3.connect(h3); h3.connect(gn); o4.connect(h5); h5.connect(gn);
        o1.start(); o2.start(); o3.start(); o4.start();
        gn.gain.linearRampToValueAtTime(target, ctx.currentTime+10);
        live.swell={gain:gn,nodes:[o1,o2,o3,o4],o1,o2,o3,o4};
      }catch(e){}
    },
    swellStop(fast){ stopVoice('swell', fast?0.05:2); },
    heartbeat(bpm){
      if(!up()) return; this.heartStop();
      try{
        const self=this;
        const v={gain:null, nodes:[], timer:null, bpm};
        /* one self-scheduling chain, so a tempo change never drops or doubles a beat */
        const tick=()=>{
          if(!ctx || live.heart!==v) return;
          self.heartbeatOnce();
          v.timer=setTimeout(tick, 60000/v.bpm);
        };
        live.heart=v;
        tick();
      }catch(e){}
    },
    heartRamp(toBpm, overSec){
      const v=live.heart; if(!v) return;
      const from=v.bpm, steps=20; let i=0;
      const st=setInterval(()=>{
        i++; if(!live.heart||live.heart!==v){ clearInterval(st); return; }
        v.bpm = from+(toBpm-from)*(i/steps);
        if(i>=steps) clearInterval(st);
      }, overSec*1000/steps);
      G.deerTimers.push(st);
    },
    heartbeatOnce(){
      if(!up()) return;
      try{
        const t=ctx.currentTime;
        /* three components per thump: the 55Hz body, plus 110/175Hz partials so the
           beat still reads on small speakers where the fundamental vanishes */
        [[0,1],[0.18,0.6]].forEach(([dt,amp])=>{
          [[55,0.22,0.125],[110,0.09,0.10],[175,0.04,0.06]].forEach(([fr,lv,dec])=>{
            const o=ctx.createOscillator(); o.frequency.value=fr;
            const gn=g(0.0001); o.connect(gn); o.start(t+dt);
            gn.gain.setValueAtTime(0.0001,t+dt);
            gn.gain.linearRampToValueAtTime(lv*amp,t+dt+0.005);
            gn.gain.exponentialRampToValueAtTime(0.0001,t+dt+dec);
            o.stop(t+dt+0.3);
          });
        });
      }catch(e){}
    },
    heartStop(){ const v=live.heart; if(v){ if(v.timer) clearTimeout(v.timer); delete live.heart; } },
    sting(){
      if(!up()) return;
      try{
        const t=ctx.currentTime;
        [2180,2205,2240].forEach(fr=>{
          const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=fr;
          const gn=g(0.0001); o.connect(gn); o.start(t);
          gn.gain.setValueAtTime(0.09,t); gn.gain.setValueAtTime(0.09,t+0.085);
          gn.gain.linearRampToValueAtTime(0.0001,t+0.09); o.stop(t+0.12);
        });
        const o=ctx.createOscillator(); o.frequency.setValueAtTime(120,t);
        o.frequency.exponentialRampToValueAtTime(30,t+0.7);
        const gn=g(0.0001); o.connect(gn); o.start(t);
        gn.gain.setValueAtTime(0.3,t); gn.gain.exponentialRampToValueAtTime(0.0001,t+0.75); o.stop(t+0.8);
        const src=ctx.createBufferSource(); src.buffer=noiseBuf(0.3);
        const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=3000;
        const ng=g(0.0001); src.connect(hp); hp.connect(ng); src.start(t);
        ng.gain.setValueAtTime(0.12,t); ng.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
      }catch(e){}
    },
    otherTone(on){
      if(!up()) return;
      if(!on){ stopVoice('other',1); return; }
      try{
        const o=ctx.createOscillator(); o.frequency.value=31;
        const oh=ctx.createOscillator(); oh.frequency.value=93;
        const hg=ctx.createGain(); hg.gain.value=0.2;
        const o5=ctx.createOscillator(); o5.frequency.value=155;
        const h5g=ctx.createGain(); h5g.gain.value=0.15;
        const s1=ctx.createOscillator(); s1.frequency.value=3130;
        const s2=ctx.createOscillator(); s2.frequency.value=3134;
        /* sg feeds gn, whose ramp tops at 0.16 — so this is a RELATIVE gain and
           needs to be ~0.08 for the shimmer to land near 0.013 absolute */
        const gn=g(0.0001), sg=ctx.createGain(); sg.gain.value=0.08;
        o.connect(gn); oh.connect(hg); hg.connect(gn);
        o5.connect(h5g); h5g.connect(gn);
        s1.connect(sg); s2.connect(sg); sg.connect(gn);
        o.start(); oh.start(); o5.start(); s1.start(); s2.start();
        gn.gain.linearRampToValueAtTime(0.16, ctx.currentTime+2);
        live.other={gain:gn,nodes:[o,oh,o5,s1,s2]};
      }catch(e){}
    },
    hammerClick(){
      if(!up()) return;
      try{
        const t=ctx.currentTime;
        const src=ctx.createBufferSource(); src.buffer=noiseBuf(0.05);
        const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=2000; f.Q.value=3;
        const gn=g(0.0001); src.connect(f); f.connect(gn); src.start(t);
        gn.gain.setValueAtTime(0.15,t); gn.gain.exponentialRampToValueAtTime(0.0001,t+0.04);
      }catch(e){}
    },
    blast(){
      if(!up()) return;
      try{
        const t=ctx.currentTime;
        const src=ctx.createBufferSource(); src.buffer=noiseBuf(0.5);
        const f=ctx.createBiquadFilter(); f.type='lowpass';
        f.frequency.setValueAtTime(6000,t); f.frequency.exponentialRampToValueAtTime(400,t+0.3);
        const gn=g(0.0001); src.connect(f);
        const dl=ctx.createDelay(); dl.delayTime.value=0.18;
        const fb=ctx.createGain(); fb.gain.value=0.35;
        f.connect(gn); f.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(gn);
        src.start(t);
        gn.gain.setValueAtTime(0.6,t); gn.gain.exponentialRampToValueAtTime(0.0001,t+1.6);
        const o=ctx.createOscillator(); o.frequency.value=50;
        const og=g(0.0001); o.connect(og); o.start(t);
        og.gain.setValueAtTime(0.0001,t); og.gain.linearRampToValueAtTime(0.5,t+0.003);
        og.gain.exponentialRampToValueAtTime(0.0001,t+0.25); o.stop(t+0.4);
      }catch(e){}
    },
    footstep(pitchMult=1){
      if(!up()) return;
      try{
        const t=ctx.currentTime;
        const src=ctx.createBufferSource(); src.buffer=noiseBuf(0.1);
        src.playbackRate.value=pitchMult;
        const f=ctx.createBiquadFilter(); f.type='bandpass';
        f.frequency.value=900+Math.random()*500; f.Q.value=1.2;
        const gn=g(0.0001); src.connect(f); f.connect(gn); src.start(t);
        gn.gain.setValueAtTime(0.0001,t); gn.gain.linearRampToValueAtTime(0.14,t+0.002);
        gn.gain.exponentialRampToValueAtTime(0.0001,t+0.07);
      }catch(e){}
    },
    silence(){ // hard-stop everything for scripted dropouts
      ['wind','crickets','swell','other'].forEach(n=>stopVoice(n,0.04));
      this.heartStop();
    },
    stopAllSoft(){
      ['wind','crickets','swell','other'].forEach(n=>stopVoice(n,0.6));
      this.heartStop();
    }
  };
})();

function eyesForNight(day){
  const out=[];
  for(let d=1; d<=day; d++){
    (EYE_ADDS[d]||[]).forEach(e=>{
      if(e[0]==='S'){ if(day===5) out.push({x:e[1],y:e[2],E:e[3],rot:e[4],sentinel:true}); }
      else out.push({x:e[0],y:e[1],E:e[2],rot:e[3]});
    });
  }
  return out;
}
function eyePairSVG(p, cls='', style=''){
  const E=p.E, sp=1.2*E, ry=0.62*E, pr=0.18*E;
  const dx=(800-p.x)>0 ? 0.15*E : -0.15*E;
  return `<g class="pair ${cls}" data-ex="${p.x}" transform="translate(${p.x},${p.y}) rotate(${p.rot||0})" ${style}>
    <ellipse class="halo" cx="0" cy="0" rx="${(3.2*E).toFixed(1)}" ry="${(2*E).toFixed(1)}"/>
    <g class="lids">
      <ellipse class="core" cx="${-sp}" cy="0" rx="${E}" ry="${ry.toFixed(1)}"/>
      <ellipse class="core" cx="${sp}" cy="0" rx="${E}" ry="${ry.toFixed(1)}"/>
      <circle class="pupil pl" cx="${(-sp+dx).toFixed(1)}" cy="0" r="${pr.toFixed(1)}"/>
      <circle class="pupil pr" cx="${(sp+dx).toFixed(1)}" cy="0" r="${pr.toFixed(1)}"/>
    </g>
  </g>`;
}
function singleEyeSVG(x,y,E,rot,extra=''){
  const ry=0.62*E, pr=0.2*E;
  return `<g class="seye" transform="translate(${x},${y}) rotate(${rot})" ${extra}>
    <ellipse class="halo" cx="0" cy="0" rx="${(2.6*E).toFixed(1)}" ry="${(1.8*E).toFixed(1)}"/>
    <g class="lids">
      <ellipse class="core" cx="0" cy="0" rx="${E}" ry="${ry.toFixed(1)}"/>
      <circle class="pupil" cx="0" cy="0" r="${pr.toFixed(1)}"/>
    </g>
  </g>`;
}
/* Deterministic PRNG for otherworld eye scatter */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---------------- SVG HELPERS ---------------- */
const fillOf = f => (f==='none'||f.startsWith('#')||f.startsWith('url')) ? f : `var(--${f})`;
function rc(x,y,w,h,f,att=''){ return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fillOf(f)}" ${att}/>`; }
function pg(pts,f,att=''){ return `<polygon points="${pts}" fill="${fillOf(f)}" ${att}/>`; }
function el(cx,cy,rx,ry,f,att=''){ return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${fillOf(f)}" ${att}/>`; }
/* Light pools are decoration: they must never intercept a click meant for the scene. */
function pool(cx,cy,rx,ry,grad){ return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${grad}" pointer-events="none"/>`; }
function ci(cx,cy,r,f,att=''){ return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fillOf(f)}" ${att}/>`; }
function ln(x1,y1,x2,y2,st,w,att=''){ return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${fillOf(st)}" stroke-width="${w}" stroke-linecap="round" ${att}/>`; }
function pth(d,f,att=''){ return `<path d="${d}" fill="${fillOf(f)}" ${att}/>`; }
function txt(x,y,size,f,content,att=''){ return `<text x="${x}" y="${y}" font-size="${size}" fill="${fillOf(f)}" ${att}>${content}</text>`; }
function vignette(op){ return `<rect x="0" y="0" width="1600" height="900" fill="url(#vign)" opacity="${op}" pointer-events="none"/>`; }
function fogPair(){ return `<g pointer-events="none">
  <rect class="fogr" x="-100" y="560" width="1800" height="120" rx="60" fill="var(--fog)" opacity=".14"/>
  <rect class="fogr f2" x="-100" y="640" width="1800" height="180" rx="90" fill="var(--fog)" opacity=".09"/></g>`; }
function hs(id,label,inner){ return `<g data-hs="${id}" data-label="${label}">${inner}</g>`; }
function hsRect(id,label,x,y,w,h){ return `<g data-hs="${id}" data-label="${label}"><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#000" opacity="0.001"/></g>`; }
/* Simple treeline: continuous jagged strip, fixed geometry across variants */
function treelineSVG(fill){
  let d='M0,560 L0,430';
  let x=0; const seed=mulberry32(11);
  while(x<1600){
    const w=40+seed()*70, peak=300+seed()*130;
    d+=` L${(x+w*0.5).toFixed(0)},${peak.toFixed(0)} L${(x+w).toFixed(0)},${(390+seed()*80).toFixed(0)}`;
    x+=w;
  }
  d+=' L1600,560 Z';
  return pth(d, fill);
}
function boySVG(x, baseY, scale=1, rim='ash', rimSide='left'){
  // From-behind silhouette: head r 20, body, legs. Feet at baseY.
  const s=scale;
  const g=`<g transform="translate(${x},${baseY}) scale(${s})" pointer-events="none">
    ${ci(0,-120,20,'void')}
    ${pg('-16,-104 16,-104 20,-40 -20,-40','void')}
    ${rc(-16,-40,12,40,'void')} ${rc(4,-40,12,40,'void')}
    ${ln(rimSide==='left'?-19:19,-116,rimSide==='left'?-21:21,-44,rim,2.5)}
  </g>`;
  return g;
}

/* --- Grounds. Fixed geometry; palette and layers vary by mode. --- */
function groundsBase(mode){
  const st=G.state, d=st.day;
  const isDay = mode==='day', isDusk = mode==='dusk1', isNight = mode==='night'||mode==='momlawn', isRed = mode==='red';
  let sky, tree, lawn1, lawn2;
  if(isDay){ sky = rc(0,0,1600,562,'url(#skyDay)'); tree='ink'; lawn1='slate'; lawn2='#20273580'; }
  else if(isDusk){ sky = rc(0,0,1600,562,'url(#skyDusk)'); tree='void'; lawn1='void'; lawn2='ink'; }
  else if(isRed){ sky = rc(0,0,1600,562,'void') ; tree='void'; lawn1='void'; lawn2='#0A0D14'; }
  else { sky = rc(0,0,1600,562,'nightSky'); tree='void'; lawn1='void'; lawn2='ink'; }
  let out = sky;
  if(isNight){ out += ci(1310,150,40,'bone') + pool(1310,150,160,160,'url(#poolMoon)'); }
  out += rc(0,556,1600,344,fillOf(lawn1).startsWith('var')?lawn1:lawn1);
  out += pg('0,620 1600,600 1600,660 0,690',lawn2) + pg('0,760 1600,730 1600,800 0,840',lawn2);
  if(isRed){ out += rc(0,352,1600,8,'redDeep','opacity=".3"'); }
  out += treelineSVG(tree);
  if(isDay){
    const n=Math.min(d-1,5);
    const spots=[[500,700],[900,660],[300,780],[1200,720],[700,820]];
    out += spots.slice(0,n).map(p=>el(p[0],p[1],60,18,'#0D1016','opacity=".7"')).join('');
  }
  /* art only — each mode adds the hotspot after its treeline rect, so the tree stays clickable */
  out += pg('255,580 285,580 278,300 262,300','#0B0E15')
    + ln(270,360,215,300,'#0B0E15',9) + ln(270,420,330,340,'#0B0E15',8) + ln(270,330,300,250,'#0B0E15',6);
  out += pg('1180,540 1520,540 1520,600 1180,600','#0B0E15');
  return out;
}
SC.grounds = (mode) => {
  const st=G.state, d=st.day;
  let out = groundsBase(mode);
  if(mode==='dusk1'){
    out += `<rect id="sunset" x="0" y="0" width="1600" height="562" fill="var(--nightSky)" opacity="0" pointer-events="none"/>`;
    out += `<g id="groundsEyes"></g>`;
    out += pool(800,940,700,260,'url(#poolEmber)');
    out += boySVG(800,780);
    out += hsRect('treeline','the treeline',0,300,1600,260);
    out += hsRect('sky','the sky',0,0,1600,280);
    out += hsRect('deadtree','the dead tree',236,286,108,296);
    out += fogPair();
    out += hsRect('inside','inside',440,780,720,120);
    out += vignette(0.6);
  } else if(mode==='day'){
    out += `<g id="groundsEyes"></g>`;
    out += boySVG(800,780);
    out += hsRect('treeline','the treeline',0,300,1600,260);
    out += hsRect('sky','the sky',0,0,1600,280);

    out += vignette(0.45);
  } else if(mode==='night'){
    const eyes = eyesForNight(d).map((p,i)=>{
      let cls='';

      if(d===4 && (p.x===840&&p.y===518 || p.x===640&&p.y===560)) cls='track';

      return eyePairSVG(p,cls);

    out += `<g id="groundsEyes">${eyes}</g>`;

    out += boySVG(800,780);

    out += fogPair();

      out += rc(w[0],w[1],140,180,dawn?'#57503F':'slate') + rc(w[0]+10,w[1]+10,120,160,winFill);
    });
    // ivy
    out += pg('140,120 240,120 210,400 160,520 140,560','#101820','opacity=".8"');
    out += pg('1460,120 1380,120 1420,420 1450,560 1460,600','#101820','opacity=".8"');
    // porch + steps
    out += rc(620,640,360,20, dawn?'#6E6250':'#0A0D14');
    out += rc(600,660,400,16, dawn?'#5E5444':'#0A0D14') + rc(580,676,440,16, dawn?'#57503F':'#080B10');
    if(dawn){
      out += rc(740,420,120,220,'#3A3226') + rc(750,430,44,200,'#57503F') + rc(806,430,44,200,'#57503F') + ci(796,540,4,'bone');
      out += pool(800,520,180,220,'url(#poolCandle)');

      out += `<g id="brick">${rc(740,420,120,220,'#1A1512')}
        ${[...Array(11)].map((_,r)=>ln(740,440+r*18,860,440+r*18,'#0D0B09',2)).join('')}
        ${[...Array(5)].map((_,r)=>ln(770+((r%2)*30),422+r*36+18,770+((r%2)*30),422+r*36+36,'#0D0B09',2)).join('')}</g>`;
      out += rc(786,380,28,18,'#0A0D14') + ln(786,380,814,398,'ash',1.5);
      out += rc(0,780,1600,120,'void');
      out += boySVG(800,790,1.2,'#5A1010','left');
      out += hsRect('turnaround','turn around',0,0,1600,724);
    }
    out += vignette(dawn?0.35:0.8);
  } else if(mode==='dawnlawn'){
    out = rc(0,0,1600,562,'url(#skyDawn)');
    out += rc(0,556,1600,344,'#8A7A5A');
    out += pg('0,620 1600,600 1600,660 0,690','#7A6E52') + pg('0,760 1600,730 1600,800 0,840','#7A6E52');

};

/* ---- text queue ---- */
let Q=[], curCard=null, choiceActive=null, curPrompt=null;
function pushCards(cards){ cards.forEach(c=>Q.push({t:c})); }
function pushFn(fn){ Q.push({fn}); }
function pushChoice(prompt,options){ Q.push({ch:{prompt,options}}); }
function pump(){
  while(Q.length){
    const it=Q.shift();
    if(it.fn){ it.fn(); if(curCard||choiceActive) return; continue; }
    if(it.t!==undefined){ curCard=it; drawCard(it.t); return; }
    if(it.ch){ choiceActive=it.ch.options; curPrompt=it.ch.prompt; drawCard(it.ch.prompt); drawChoices(it.ch.options); return; }
  }
  curCard=null; curPrompt=null; drawCard(null);
}
function say(cards, after){
  pushCards(Array.isArray(cards)?cards:[cards]);
  if(after) pushFn(after);
  if(!curCard && !choiceActive) pump();
}
function advanceCard(){ if(choiceActive||!curCard) return; curCard=null; pump(); }
function doChoice(i){
  const opts=choiceActive; if(!opts) return;
  const opt=opts[i];
  if(!opt) return;   /* a key with no matching button must never cancel the choice */
  choiceActive=null; curPrompt=null; drawChoices(null); drawCard(null);
  opt.fn();
  if(!curCard&&!choiceActive&&Q.length) pump();
}
const queueBusy=()=> !!curCard || !!choiceActive;

/* ---- UI ---- */
function wrapText(text, maxChars=96){
  const words=String(text).split(' '); const lines=[]; let line='';
  for(const w of words){
    if((line+' '+w).trim().length>maxChars){ lines.push(line.trim()); line=w; }
    else line+=' '+w;
  }
  if(line.trim()) lines.push(line.trim());
  return lines;
}

function drawCard(text){
  const pt=$('panelText'), adv=$('adv'), hl=$('hoverLabel'), bg=$('panelBg');
  if(!pt) return;
  if(text===null||text===undefined){
    pt.innerHTML=''; if(adv) adv.style.display='none';   /* the pulse animation drives opacity, so hide by display */
    if(hl) hl.textContent='';
    if(bg) bg.setAttribute('opacity','0');   /* idle: the scene is fully visible and clickable */
    return;
  }
  if(hl) hl.textContent='';
  if(bg) bg.setAttribute('opacity','.92');
  const lines=wrapText(text);
  pt.innerHTML=lines.slice(0,3).map((l,i)=>
    `<text x="72" y="${772+i*34}" font-size="26" fill="var(--textMain)">${l}</text>`).join('');
  if(adv) adv.style.display = choiceActive?'none':'';
}
function drawChoices(options){
  const cg=$('choicesG'); if(!cg) return;
  if(!options){ cg.innerHTML=''; return; }
  let x=72; const y=812;
  cg.innerHTML=options.map((o,i)=>{
    const w=Math.max(120, o.label.length*11.5+44);
    const s=`<g data-choice="${i}"><rect x="${x}" y="${y}" width="${w}" height="44" rx="4"/>
      <text x="${x+w/2}" y="${y+29}" font-size="22" text-anchor="middle">${o.label}</text></g>`;
    x+=w+20; return s;
  }).join('');
  const adv=$('adv'); if(adv) adv.style.display='none';
}

/* ---- scene rendering & transitions ---- */
function renderScene(){
  let svg='';
  if(G.mode==='title') svg=SC.title();
  else if(G.mode==='deathcard') svg=SC.deathcard();
  else if(G.mode==='goodcard') svg=SC.goodcard();
  else {
    const r=G.state.room;
    if(r==='grounds') svg=SC.grounds(G.groundsMode);
    else if(SC[r]) svg=SC[r]();
  }
  sceneG.innerHTML=svg;
}
function fadeTo(fn, ms=350){
  G.locked=true;
  fadeR.classList.remove('slow','instant');
  fadeR.setAttribute('opacity','1');
  T(()=>{ fn(); T(()=>{ fadeR.setAttribute('opacity','0'); T(()=>{G.locked=false;},360); },60); }, ms+30);
}
function hardCut(fn){
  fadeR.classList.add('instant'); fadeR.setAttribute('opacity','1');
  fn();
  T(()=>{ fadeR.setAttribute('opacity','0'); fadeR.classList.remove('instant'); },50);
}
function goRoom(room, mode, after){
  fadeTo(()=>{
    G.state.room=room;
    if(mode) G.groundsMode=mode;
    renderScene(); renderUI();
    ambientFor(room);
    if(after) after();
    if(room==='library') libraryEntryHook();
    if(room==='office') officeEntryHook();
  });
}
function ambientFor(room){
  if(!A.on) return;
  const st=G.state;
  if(room==='grounds'){
    A.wind(false);
    A.crickets(st.day<=3 && (st.phase==='NIGHT'||st.phase==='DUSK'));
    if(st.phase==='NIGHT' && G.groundsMode==='night'){
      A.swell(44-(st.day-1)*2, 0.12+(st.day-1)*0.036);
      if(st.day===6) A.windDuck(0.2);
    } else if(G.groundsMode!=='dusk1'){
      A.swellStop(false); A.heartStop();   /* daylight and the mom scene stay quiet */
    }
  } else if(room==='clearing'){ /* handled by set piece */ }
  else { A.crickets(false); A.swellStop(false); A.heartStop(); A.wind(true); }
}
function libraryEntryHook(){
  const st=G.state;
  if(st.day>=3 && !st.hasKey && !st.d3LibNotice){ st.d3LibNotice=true; say(S.D3_LIBRARY_ENTRY); }
}
function officeEntryHook(){
  const st=G.state;
  if(!st.officeEntered){ st.officeEntered=true; say(S.OFFICE_ENTER); }
}

/* ---- phase flow ---- */
function toDusk(){
  const st=G.state; st.phase='DUSK';
  st.trayHere = st.day>=2 && st.day<=6;
  renderScene(); renderUI();
  const d=st.day;
  if(d===1) say(S.D1_DINNER);
  else if(d===2){ const c=[...S.D2_DINNER]; if(!st.wentOutEarlyToday) c.push(S.D2_DINNER_LATEHINT[0]); say(c); }
  else if(d===3) say(S.D3_DINNER);
  else if(d===4) say(S.D4_DINNER);
  else if(d===5) say(S.D5_DINNER);
  else if(d===6) say(S.D6_DINNER);
  else if(d===7) say(S.D7_DINNER);
}
function toNight(){
  const st=G.state; st.phase='NIGHT';
  renderScene(); renderUI();
  if(st.day===7) say(S.D7_GUT);

function scriptedBlink(pairEl, speed=120){

  lids.style.transform='scaleY(0.05)';

    T(()=>{ lids.style.transitionDuration=''; }, speed+50); }, speed+ (speed>200?400:200));
}
function unisonBlink(){
  const g=document.getElementById('groundsEyes'); if(!g) return;
  g.style.transition='opacity .09s'; g.style.opacity='0';
  T(()=>{ g.style.opacity='1'; T(()=>{g.style.transition='';},120); },90);

let trackRAF=null, mousePt={x:800,y:450};
function startTracking(){
  stopTracking();
  const pairs=[...document.querySelectorAll('#groundsEyes .track')];
  if(!pairs.length) return;
  const state=pairs.map(p=>({p, dx:0, dy:0,
    pl:p.querySelector('.pl'), pr:p.querySelector('.pr'),
    blx:+p.querySelector('.pl').getAttribute('cx'), bly:0,
    brx:+p.querySelector('.pr').getAttribute('cx') }));
  const step=()=>{
    state.forEach(s=>{
      const ex=+s.p.dataset.ex;
      const tx=Math.max(-3,Math.min(3,(mousePt.x-ex)/160));
      const ty=Math.max(-3,Math.min(3,(mousePt.y-500)/160));
      s.dx+= (tx-s.dx)*0.12; s.dy+=(ty-s.dy)*0.12;
      s.pl.setAttribute('cx', s.blx+s.dx); s.pl.setAttribute('cy', s.dy);
      s.pr.setAttribute('cx', s.brx+s.dx); s.pr.setAttribute('cy', s.dy);
    });
    trackRAF=requestAnimationFrame(step);
  };
  trackRAF=requestAnimationFrame(step);
}
function stopTracking(){ if(trackRAF){ cancelAnimationFrame(trackRAF); trackRAF=null; } }
function goInside(){

/* ---------------- HOTSPOT ROUTER ---------------- */
function route(id){
  const st=G.state, r=st.room, d=st.day, ph=st.phase;
  /* inventory */
  if(id==='invgun'){ say(st.hasShells?S.GUN_EXAMINE_FULL:S.GUN_EXAMINE); return; }
  if(id==='invshells'){ say(S.SHELLS_EXAMINE); return; }
  if(id==='invkey'){ say(S.INVKEY_LOOK); return; }

  if(r==='bedroom'){
    if(id==='bed'){
      if(ph==='MORNING'){ say(S.BED_READ, toDusk); }
      else if(ph==='DUSK'){ say(S.BED_WAIT, toNight); }
      else if(ph==='NIGHT'){ trySleep(); }
      return;
    }
    if(id==='window'){
      if(ph==='NIGHT'&&d===7) say([`Red. All of it red.`]);
      else if(ph==='NIGHT'&&d>=4&&!st.nightOutingDone) say([`Faint white points, far off, where the trees are.`]);
      else if(d===1) say([`The lawn, the treeline, the ordinary sky.`]);
      else say([`The lawn stays empty. You watch it not move.`]);
      return;
    }
    if(id==='bookshelf'){
      if(d===7){ st.readBook[7]=true; say(S.BOOK_7); }
      else if(d>=5) say([`You read the same page three times. The words keep being about eyes.`]);
      else say([`Sea stories and boys with dogs. The dog always lives.`]);
      return;
    }
    if(id==='door'){ goRoom('hallway'); return; }
  }

  if(r==='hallway'){
    if(id==='bedroomdoor'){ goRoom('bedroom'); return; }
    if(id==='stairs'){ goRoom('foyer'); return; }
    if(id==='parentsdoor'){ say(d===7?[`You knock. The sound doesn’t come back.`]:[`Your parents’ room. You knock twice a year, maybe.`]); return; }
    if(id==='portrait'){ say(d>=6?[`A Vane from before photographs. The paint looks faded. Only the eyes.`]:[`A Vane from before photographs. He watches the middle distance.`]); return; }
    if(id==='hallwindow'){
      if(ph==='NIGHT'&&d===7) say([`Red. All of it red.`]);
      else if(ph==='NIGHT'&&d>=4&&!st.nightOutingDone) say([`Faint white points, far off, where the trees are.`]);
      else say([`The lawn, from up here. The treeline keeps its distance. For now that is the arrangement.`]);
      return;
    }
    if(id==='tray'){ if(st.trayHere) eatTray(); return; }
    if(id==='officedoor'){
      if(st.officeUnlocked){ goRoom('office'); }
      else if(st.hasKey){ st.officeUnlocked=true; say(S.OFFICE_UNLOCK); }
      else say(S.OFFICE_LOCKED);
      return;
    }
  }

  if(r==='foyer'){
    if(id==='stairs'){ goRoom('hallway'); return; }
    if(id==='diningarch'){ goRoom('dining'); return; }
    if(id==='librarydoor'){ goRoom('library'); return; }
    if(id==='coatrack'){ say([`Your father’s coat. He’s gone more days than not.`]); return; }
    if(id==='mom'){ momSequence(); return; }
    if(id==='clock'){
      if(ph==='MORNING'){ say(S.CLOCK_AM, toDusk); }
      else if(ph==='DUSK'){ say(S.CLOCK_DUSK, toNight); }
      else say(d<=3?S.CLOCK_N_EARLY:(d<=6?S.CLOCK_N_MID:S.CLOCK_N_LATE));
      return;
    }
    if(id==='frontdoor'){
      if(d===1){
        if(ph==='MORNING') say(S.FRONTDOOR_D1_AM);
        else if(!st.spAdone) setPieceA();   /* dusk or night — the first outing is always reachable */
        else say(S.FRONTDOOR_D1_LATE);
      } else {
        if(ph==='MORNING') earlyOuting();
        else if(ph==='DUSK') say(d===7?S.FRONTDOOR_D7_DUSK:S.FRONTDOOR_DUSK);
        else if(ph==='NIGHT'){ if(d===7) setPieceB(); else nightOuting(); }
      }
      return;
    }
  }

  if(r==='office'){
    if(id==='door'){ goRoom('hallway'); return; }
    if(id==='cabinet'){
      if(st.hasGun){ say(S.GUN_GONE); return; }
      if(st.cabClicks===0){ st.cabClicks=1; say(S.GUN_LOOK); return; }
      pushCards(S.GUN_HESITATE.slice(0,2));
      pushChoice(S.GUN_HESITATE[2], [
        {label:'Take it', fn:()=>{ st.hasGun=true; say(S.GUN_TAKE); renderScene(); renderUI(); invPop('invgun'); }},
        {label:'Leave it', fn:()=>{}}
      ]);
      pump(); return;
    }
    if(id==='drawer'){
      if(st.hasShells){ say(S.SHELLS_GONE); return; }
      if(st.drawerClicks===0){ st.drawerClicks=1; st.drawerOpen=true; say(S.SHELLS_LOOK); renderScene(); renderUI(); return; }
      pushCards(S.SHELLS_HESITATE.slice(0,2));
      pushChoice(S.SHELLS_HESITATE[2], [
        {label:'Take them', fn:()=>{ st.hasShells=true; say(S.SHELLS_TAKE); renderScene(); renderUI(); invPop('invshells'); }},
        {label:'Leave them', fn:()=>{}}
      ]);
      pump(); return;
    }
    if(id==='papers'){ say([`Ledgers and letters. Words like acreage and boundary and easement. One letter, much older, unsigned: “the observance is yours now.”`]); return; }
    if(id==='fireplace'){ say([`Coals kept in, even with nobody home. Somebody tends this.`]); return; }
    if(id==='officewindow'){ say([`It faces the treeline. Of all the rooms in the house, this one faces it squarely.`]); return; }
  }

  if(r==='dining'){
    if(id==='door'){ goRoom('foyer'); return; }
    if(id==='table'){ say(d===7?[`Set for nobody.`]:[`Set for three. One chair pulled out.`]); return; }
    if(id==='dwindow'){
      if(d===7&&ph==='NIGHT') say([`The glass holds a red glow that isn’t in the room.`]);
      else if(d>=5&&d<=6&&ph==='NIGHT'&&!st.nightOutingDone) say([`From here you can see them without going out. That feels like cheating. You go anyway.`]);
      else say([`The lawn, from behind glass. The glass feels thinner every day.`]);
      return;
    }
  }

  if(r==='library'){
    if(id==='door'){ goRoom('foyer'); return; }
    if(id==='tablebook'){ if(d>=1&&d<=6) showBook(d); return; }
    if(id==='halfbook'){
      if(d>=3&&!st.hasKey){ st.hasKey=true; say(S.KEY_TAKE); renderScene(); renderUI(); invPop('invkey'); }
      return;
    }
    if(id==='shelves'){ say([`Spines the color of old leaves. Nobody has read most of these. Most of these would rather not be read.`]); return; }
    if(id==='chair'){ say([`Nobody sits here but you. The cushion holds your shape and nobody else’s.`]); return; }
  }

  if(r==='grounds'){
    const m=G.groundsMode;
    if(m==='dusk1'){
      if(st.spAdone){ if(id==='inside') goInside(); return; }
      if(id==='deadtree'){ say([`It died standing up. Nobody’s taken it down.`]); if(G.spA_interact) G.spA_interact(); return; }
      if(id==='treeline'){ say([`The treeline is only trees.`]); if(G.spA_interact) G.spA_interact(); return; }
      if(id==='sky'){ say([`The sun is low. Lower than you meant to let it get.`]); if(G.spA_interact) G.spA_interact(); return; }
      if(id==='inside'){ say(S.FRONTDOOR_D1_EARLY); if(G.spA_interact) G.spA_interact(); return; }
      return;
    }
    if(m==='day'){
      if(id==='treeline'){ say([`The treeline is only trees.`]); return; }
      if(id==='deadtree'){ say([`It died standing up. Nobody’s taken it down.`]); return; }
      if(id==='sky'){ say(d===7?[`No birds. Not one.`]:[`The moon is up in the daytime, thin as a nail paring.`]); return; }
      if(id==='grass'){ say(d<=4?[`The grass is flat in one spot. Like something heavy stood there all night.`]:[`The flat patches reach halfway up the lawn now.`]); return; }
      if(id==='inside'){ goRoom('foyer'); return; }
      return;
    }
    if(m==='night'){
      if(id==='inside'){ goInside(); return; }
      if(id==='deadtree'){ say([`It died standing up. Nobody’s taken it down.`]); return; }
      return;
    }
    if(m==='red'){ if(id==='turnback') doorGone(); return; }
    if(m==='doorgone'){ if(id==='turnaround') setPieceC(); return; }
    return;
  }

  if(r==='clearing'){
    if(G.confronted) return;
    if(st.clearingClicks>=2 || id==='deer'){ confront(); return; }
    if(id==='herd'){ st.clearingClicks++; say(S.CLR_RING); return; }
    if(id==='dark'){ st.clearingClicks++; say(S.CLR_VOID); return; }
    return;
  }
}

/* ---------------- INPUT ---------------- */
function handleActivate(target){
  const t = target && target.closest ? target.closest('[data-choice],[data-ui],[data-hs]') : null;
  if(G.mode!=='title') A.ensure();   /* every click is a gesture: revive a context the browser suspended */
  if(t && t.getAttribute('data-ui')==='help'){   // always available, even mid-scene
    if(bookOpen) closeBook(); else showHelp();
    return;
  }
  if(t && t.hasAttribute('data-ui')){ // mute always works
    A.ensure(); const nowMuted=A.toggleMute(); renderUI();
    /* say it out loud in text — an accidental click here must never be invisible */
    const note=document.createElementNS('http://www.w3.org/2000/svg','text');
    note.setAttribute('x','1520'); note.setAttribute('y','92');
    note.setAttribute('text-anchor','end'); note.setAttribute('font-size','18');
    note.setAttribute('fill', nowMuted?'var(--eyeRed)':'var(--textDim)');
    note.setAttribute('font-style','italic'); note.setAttribute('pointer-events','none');
    note.textContent = nowMuted ? 'sound off' : 'sound on';
    uiG.appendChild(note);
    setTimeout(()=>{ try{ note.remove(); }catch(e){} },2600);
    return;
  }
  if(G.locked) return;
  if(bookOpen){ closeBook(); return; }
  if(G.mode==='title'){
    const choice = t && t.getAttribute('data-choice');
    if(choice==='continue'){ continueGame(); return; }
    if(G.savedGame){                  /* a save exists: only the two buttons act, so it is never lost by accident */
      if(choice==='newgame') startGame();
      return;
    }
    startGame(); return;
  }
  if(G.mode==='deathcard'){
    if(t && t.hasAttribute('data-choice')){
      const c=t.getAttribute('data-choice');
      if(c==='retry') mercyRestart(); else fullRestart();
    }
    return;
  }
  if(G.mode==='goodcard'){
    if(t && t.hasAttribute('data-choice')) fullRestart();
    return;
  }
  if(choiceActive){
    if(t && t.hasAttribute('data-choice')) doChoice(+t.getAttribute('data-choice'));
    return;
  }
  if(curCard){ advanceCard(); return; }
  if(t && t.hasAttribute('data-hs')) route(t.getAttribute('data-hs'));
}
gameSvg.addEventListener('click', e=>handleActivate(e.target));
gameSvg.addEventListener('mouseover', e=>{
  const hl=$('hoverLabel');
  if(!hl || curCard || choiceActive || G.locked) return;
  const t=e.target.closest ? e.target.closest('[data-hs]') : null;
  hl.textContent = t ? (t.getAttribute('data-label')||'') : '';
});
gameSvg.addEventListener('mousemove', e=>{
  if(!trackRAF) return;
  const pt=gameSvg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
  try{
    const ctm=gameSvg.getScreenCTM(); if(!ctm) return;
    const p=pt.matrixTransform(ctm.inverse());
    mousePt={x:p.x,y:p.y};
  }catch(err){}
});
document.addEventListener('keydown', e=>{
  if(e.key===' '||e.key==='Enter'){ e.preventDefault(); if(!G.locked&&!choiceActive) handleActivate(null); }
  if(choiceActive && ['1','2','3'].includes(e.key)) doChoice(+e.key-1);
});
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) A.resume(); });

/* ---------------- BOOT ---------------- */
function armTitleEye(){ T(()=>{ const te=$('titleEye'); if(te) te.setAttribute('opacity','1'); },3000); }
function startGame(){
  A.ensure();
  clearSave();
  G.state=freshState(); G.confronted=false; G.mode='play';
  fadeTo(()=>{
    renderScene(); renderUI(); A.wind(true);
    say([...S.INTRO_1, ...S.INTRO_2, ...S.D1_WAKE]);
  });
}
function continueGame(){
  A.ensure();
  const s=G.savedGame; if(!s){ startGame(); return; }
  G.state=Object.assign(freshState(), s, { phase:'MORNING', room:'bedroom' });
  G.confronted=false; G.mode='play';
  fadeTo(()=>{ renderScene(); renderUI(); A.wind(true); wakeCards(); });
}
G.state=freshState();
loadSave();
renderScene(); renderUI(); armTitleEye();
</script>
