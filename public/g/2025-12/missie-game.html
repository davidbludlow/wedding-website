<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrot Eating Competition</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Arial', sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: #fff;
      }

      .game-container {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 40px;
        max-width: 900px;
        width: 90%;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      }

      h1 {
        text-align: center;
        margin-bottom: 30px;
        font-size: 2.5em;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }

      .timer {
        text-align: center;
        font-size: 3em;
        margin-bottom: 30px;
        font-weight: bold;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }

      .players-container {
        display: flex;
        justify-content: space-between;
        gap: 30px;
        margin-bottom: 30px;
      }

      .player {
        flex: 1;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 15px;
        padding: 25px;
        text-align: center;
        transition: transform 0.1s;
      }

      .player.active {
        transform: scale(1.05);
        background: rgba(255, 255, 255, 0.25);
      }

      .player h2 {
        margin-bottom: 15px;
        font-size: 1.8em;
      }

      .score {
        font-size: 4em;
        font-weight: bold;
        margin: 20px 0;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }

      .carrot-display {
        font-size: 3em;
        margin: 15px 0;
        min-height: 60px;
      }

      .key-hint {
        font-size: 1.2em;
        opacity: 0.8;
        margin-top: 10px;
      }

      .controls {
        text-align: center;
        margin-top: 30px;
      }

      button {
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        border: none;
        color: white;
        padding: 15px 40px;
        font-size: 1.2em;
        border-radius: 50px;
        cursor: pointer;
        font-weight: bold;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        transition: all 0.3s;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      }

      button:active {
        transform: translateY(0);
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .game-over {
        display: none;
        text-align: center;
        padding: 30px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 15px;
        margin-bottom: 20px;
      }

      .game-over.show {
        display: block;
      }

      .winner-text {
        font-size: 2.5em;
        margin-bottom: 20px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }

      .final-scores {
        font-size: 1.5em;
        margin-bottom: 20px;
      }

      @keyframes carrotEat {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.3);
        }
      }

      .eating {
        animation: carrotEat 0.3s ease;
      }

      .instructions {
        text-align: center;
        margin-bottom: 20px;
        font-size: 1.1em;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="game-container">
      <h1>🥕 Carrot Eating Competition 🥕</h1>

      <div class="instructions">
        Press START to begin! Players compete to eat the most carrots in 45
        seconds!
      </div>

      <div class="timer" id="timer">0:45</div>

      <div class="game-over" id="gameOver">
        <div class="winner-text" id="winnerText"></div>
        <div class="final-scores" id="finalScores"></div>
      </div>

      <div class="players-container">
        <div class="player" id="player1">
          <h2>🎮 Player 1</h2>
          <div class="score" id="score1">0</div>
          <div class="carrot-display" id="carrot1"></div>
          <div class="key-hint">Press 'A' key</div>
        </div>

        <div class="player" id="player2">
          <h2>🎮 Player 2</h2>
          <div class="score" id="score2">0</div>
          <div class="carrot-display" id="carrot2"></div>
          <div class="key-hint">Press 'L' key</div>
        </div>
      </div>

      <div class="controls">
        <button id="startBtn" onclick="startGame()">START GAME</button>
        <button id="resetBtn" onclick="resetGame()" style="display: none">
          PLAY AGAIN
        </button>
      </div>
    </div>

    <script>
      let timeLeft = 45;
      let gameActive = false;
      let timerInterval;
      let scores = { player1: 0, player2: 0 };

      function startGame() {
        // Reset everything
        timeLeft = 45;
        scores = { player1: 0, player2: 0 };
        gameActive = true;

        // Update UI
        document.getElementById('score1').textContent = '0';
        document.getElementById('score2').textContent = '0';
        document.getElementById('carrot1').textContent = '';
        document.getElementById('carrot2').textContent = '';
        document.getElementById('gameOver').classList.remove('show');
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('resetBtn').style.display = 'none';

        // Start timer
        updateTimer();
        timerInterval = setInterval(() => {
          timeLeft--;
          updateTimer();

          if (timeLeft <= 0) {
            endGame();
          }
        }, 1000);
      }

      function updateTimer() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        document.getElementById('timer').textContent = `${minutes}:${seconds
          .toString()
          .padStart(2, '0')}`;
      }

      function eatCarrot(player) {
        if (!gameActive) return;

        const playerNum = player === 'player1' ? '1' : '2';
        scores[player]++;

        // Update score
        document.getElementById(`score${playerNum}`).textContent =
          scores[player];

        // Show carrot animation
        const carrotDisplay = document.getElementById(`carrot${playerNum}`);
        const playerDiv = document.getElementById(player);

        carrotDisplay.textContent = '🥕';
        carrotDisplay.classList.add('eating');
        playerDiv.classList.add('active');

        // Remove animation after it completes
        setTimeout(() => {
          carrotDisplay.classList.remove('eating');
          carrotDisplay.textContent = '';
          playerDiv.classList.remove('active');
        }, 300);
      }

      function endGame() {
        clearInterval(timerInterval);
        gameActive = false;

        // Determine winner
        const gameOverDiv = document.getElementById('gameOver');
        const winnerText = document.getElementById('winnerText');
        const finalScores = document.getElementById('finalScores');

        if (scores.player1 > scores.player2) {
          winnerText.textContent = '🏆 Player 1 Wins! 🏆';
        } else if (scores.player2 > scores.player1) {
          winnerText.textContent = '🏆 Player 2 Wins! 🏆';
        } else {
          winnerText.textContent = "🤝 It's a Tie! 🤝";
        }

        finalScores.innerHTML = `
                Player 1: ${scores.player1} carrots 🥕<br>
                Player 2: ${scores.player2} carrots 🥕
            `;

        gameOverDiv.classList.add('show');
        document.getElementById('resetBtn').style.display = 'inline-block';
      }

      function resetGame() {
        document.getElementById('startBtn').style.display = 'inline-block';
        document.getElementById('resetBtn').style.display = 'none';
        document.getElementById('gameOver').classList.remove('show');
        document.getElementById('timer').textContent = '0:45';
        document.getElementById('score1').textContent = '0';
        document.getElementById('score2').textContent = '0';
        document.getElementById('carrot1').textContent = '';
        document.getElementById('carrot2').textContent = '';
      }

      // Keyboard controls
      document.addEventListener('keydown', (event) => {
        const key = event.key.toLowerCase();

        if (key === 'a') {
          eatCarrot('player1');
        } else if (key === 'l') {
          eatCarrot('player2');
        }
      });

      // Prevent spacebar from scrolling
      window.addEventListener('keydown', (e) => {
        if (e.key === ' ' && e.target === document.body) {
          e.preventDefault();
        }
      });
    </script>
  </body>
</html>
