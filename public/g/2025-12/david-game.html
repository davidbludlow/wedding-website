<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worms Battle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        
        #gameContainer {
            background: #1a1a2e;
            border-radius: 10px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
            padding: 20px;
            position: relative;
        }
        
        canvas {
            border: 3px solid #16213e;
            border-radius: 5px;
            display: block;
            background: #87CEEB;
        }
        
        #speechBubble {
            position: absolute;
            background: white;
            color: black;
            padding: 5px 10px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            pointer-events: none;
            display: none;
            border: 2px solid #333;
            z-index: 1000;
        }
        
        #controls {
            margin-top: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
            background: #0f3460;
            padding: 15px;
            border-radius: 5px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        label {
            color: #e94560;
            font-weight: bold;
            font-size: 12px;
        }
        
        input[type="range"] {
            width: 120px;
        }
        
        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #ff6b6b;
            transform: scale(1.05);
        }
        
        button:disabled {
            background: #555;
            cursor: not-allowed;
            transform: scale(1);
        }
        
        select {
            padding: 8px;
            border-radius: 5px;
            border: none;
            background: #16213e;
            color: white;
            font-weight: bold;
        }
        
        #touchControls {
            display: flex;
            gap: 10px;
            align-items: center;
            background: #16213e;
            padding: 10px;
            border-radius: 5px;
            justify-content: center;
        }
        
        .touch-btn {
            background: #e94560;
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 20px;
            transition: all 0.2s;
            user-select: none;
            -webkit-user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        
        .touch-btn:active {
            background: #ff6b6b;
            transform: scale(0.95);
        }
        
        .touch-btn.fire-btn {
            width: 70px;
            height: 70px;
            font-size: 12px;
            flex-direction: column;
        }
        
        #instructions {
            color: #4ecca3;
            font-size: 11px;
            margin-top: 10px;
            padding: 8px;
            background: #16213e;
            border-radius: 5px;
            text-align: center;
        }
        
        #info {
            color: white;
            margin-top: 10px;
            padding: 10px;
            background: #16213e;
            border-radius: 5px;
            font-size: 14px;
        }
        
        .value-display {
            color: #4ecca3;
            font-weight: bold;
            min-width: 40px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="speechBubble"></div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="controls">
            <div class="control-group">
                <label>Angle: <span class="value-display" id="angleValue">45</span>°</label>
                <input type="range" id="angle" min="0" max="180" value="45">
            </div>
            <div class="control-group">
                <label>Weapon:</label>
                <select id="weapon" autocomplete="off">
                    <option value="bazooka" selected>Bazooka</option>
                    <option value="grenade">Grenade</option>
                    <option value="airstrike">Air Strike</option>
                </select>
            </div>
            <button id="newGameBtn">New Game</button>
        </div>
        <div id="touchControls">
            <button class="touch-btn" id="touchLeft">◄</button>
            <button class="touch-btn" id="touchUp">▲</button>
            <button class="touch-btn" id="touchDown">▼</button>
            <button class="touch-btn" id="touchRight">►</button>
            <button class="touch-btn fire-btn" id="touchFire">HOLD<br>FIRE</button>
        </div>
        <div id="instructions">
            ARROWS: Move/Aim | SPACE/FIRE BTN: Hold to charge (50%→0%→100%), release to shoot
        </div>
        <div id="info">
            <div><strong>Turn:</strong> <span id="currentTeam">Team 1</span></div>
            <div><strong>Wind:</strong> <span id="windDisplay">0</span> <span id="windIndicator" style="font-size: 20px; color: #4a90e2; font-weight: bold;"></span></div>
            <div><strong>Team 1:</strong> <span id="team1Worms">3</span> worms | <strong>Team 2:</strong> <span id="team2Worms">3</span> worms</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Game state
        let gameState = {
            currentTeam: 1,
            worms: [],
            terrain: [],
            projectiles: [],
            explosions: [],
            wind: 0,
            team1WormIndex: 0,
            team2WormIndex: 0,
            isAnimating: false,
            cameraShake: 0,
            chargingPower: false,
            powerCharge: 50,
            powerPhase: 0, // 0: 50->0, 1: 0->100, 2: 100->0, 3: 0->100
            hasFiredThisTurn: false
        };
        
        const fireMessages = ["Take this!", "Eat this!", "Fire in the hole!", "Incoming!", "Boom time!"];
        const hitMessages = ["Ow!", "Ouch!", "Argh!", "Oof!", "Ugh!"];
        
        // Worm class
        class Worm {
            constructor(x, y, team) {
                this.x = x;
                this.y = y;
                this.team = team;
                this.health = 100;
                this.radius = 8;
                this.alive = true;
                this.vx = 0;
                this.vy = 0;
                this.facing = 'right';
                this.lastAngle = 45;
                this.lastPower = 50;
            }
            
            draw() {
                if (!this.alive) return;
                
                ctx.save();
                
                // Draw worm body
                ctx.fillStyle = this.team === 1 ? '#ff6b6b' : '#4ecca3';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw eyes based on facing direction
                const eyeOffset = this.facing === 'right' ? 1 : -1;
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(this.x - 3 * eyeOffset, this.y - 2, 2, 0, Math.PI * 2);
                ctx.arc(this.x + 3 * eyeOffset, this.y - 2, 2, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw pupils
                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.arc(this.x - 3 * eyeOffset, this.y - 2, 1, 0, Math.PI * 2);
                ctx.arc(this.x + 3 * eyeOffset, this.y - 2, 1, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw health bar
                ctx.fillStyle = 'red';
                ctx.fillRect(this.x - 15, this.y - 20, 30, 4);
                ctx.fillStyle = 'green';
                ctx.fillRect(this.x - 15, this.y - 20, (this.health / 100) * 30, 4);
                
                ctx.restore();
            }
            
            update() {
                if (!this.alive) {
                    // Ensure dead worms never block turn-end "all stopped" checks
                    this.vx = 0;
                    this.vy = 0;
                    return;
                }
                
                // Apply gravity
                this.vy += 0.3;
                
                // Update position
                this.x += this.vx;
                this.y += this.vy;
                
                // Friction
                this.vx *= 0.95;
                
                // Check terrain collision
                if (this.y + this.radius >= canvas.height || isOnTerrain(this.x, this.y + this.radius)) {
                    this.y = findTerrainY(this.x) - this.radius;
                    this.vy = 0;
                    this.vx = 0;
                }
                
                // Boundaries
                if (this.x < this.radius) this.x = this.radius;
                if (this.x > canvas.width - this.radius) this.x = canvas.width - this.radius;
                
                // Fall off map
                if (this.y > canvas.height) {
                    this.alive = false;
                    this.health = 0;
                    this.vx = 0;
                    this.vy = 0;
                    updateUI();
                }
            }
            
            takeDamage(damage, explosionX, explosionY) {
                if (damage > 10) {
                    showSpeech(this.x, this.y - 30, hitMessages[Math.floor(Math.random() * hitMessages.length)]);
                }
                
                // Knockback (only for living worms)
                const dx = this.x - explosionX;
                const dy = this.y - explosionY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 0) {
                    this.vx = (dx / dist) * (damage / 10);
                    this.vy = (dy / dist) * (damage / 10) - 3;
                }

                this.health -= damage;
                if (this.health <= 0) {
                    this.health = 0;
                    this.alive = false;
                    // Dead worms shouldn't keep momentum (prevents turn lock)
                    this.vx = 0;
                    this.vy = 0;
                    updateUI();
                }
            }
            
            move(direction) {
                if (!this.alive || gameState.isAnimating) return;
                
                const speed = 2;
                const newX = this.x + (direction === 'right' ? speed : -speed);
                
                // Check boundaries
                if (newX < this.radius || newX > canvas.width - this.radius) return;
                
                // Move and update facing
                this.x = newX;
                this.facing = direction;
                
                // Adjust to terrain
                const terrainY = findTerrainY(this.x);
                if (this.y > terrainY - this.radius) {
                    this.y = terrainY - this.radius;
                }
            }
        }
        
        // Projectile class
        class Projectile {
            constructor(x, y, angle, power, type) {
                const rad = (angle * Math.PI) / 180;
                // Start projectile further from worm (20 pixels away in firing direction)
                const startOffset = 20;
                this.x = x + Math.cos(rad) * startOffset;
                this.y = y - Math.sin(rad) * startOffset;
                this.vx = Math.cos(rad) * power * 0.3;
                this.vy = -Math.sin(rad) * power * 0.3;
                this.type = type;
                this.timer = type === 'grenade' ? 4000 : 0;
                this.startTime = Date.now();
                this.active = true;
            }
            
            draw() {
                ctx.fillStyle = this.type === 'grenade' ? '#2d3436' : '#e17055';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
                ctx.fill();
                
                // Trail
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x - this.vx * 2, this.y - this.vy * 2);
                ctx.stroke();
            }
            
            update() {
                // Apply physics
                this.vx += gameState.wind * 0.03;
                this.vy += 0.3;
                
                this.x += this.vx;
                this.y += this.vy;
                
                // Check grenade timer
                if (this.type === 'grenade' && Date.now() - this.startTime > this.timer) {
                    this.explode();
                    return;
                }
                
                // Check collision with worms (bazooka explodes on contact, grenade bounces)
                for (let worm of gameState.worms) {
                    if (worm.alive) {
                        const dx = this.x - worm.x;
                        const dy = this.y - worm.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        
                        if (dist < 15) {
                            if (this.type === 'bazooka') {
                                // Bazooka explodes on worm contact
                                this.explode();
                                return;
                            } else if (this.type === 'grenade') {
                                // Grenade bounces off worms
                                this.vx *= -0.5;
                                this.vy *= -0.5;
                                // Move away from worm to prevent sticking
                                this.x += dx * 0.1;
                                this.y += dy * 0.1;
                            }
                        }
                    }
                }
                
                // Check terrain collision
                if (this.y >= canvas.height || isOnTerrain(this.x, this.y)) {
                    if (this.type === 'bazooka') {
                        // Bazooka explodes on terrain
                        this.explode();
                    } else if (this.type === 'grenade') {
                        // Grenade bounces
                        this.vy *= -0.6; // Bounce with energy loss
                        this.vx *= 0.8;  // Friction
                        this.y = findTerrainY(this.x) - 5; // Place above terrain
                        
                        // If moving too slowly, settle on terrain
                        if (Math.abs(this.vy) < 1 && Math.abs(this.vx) < 1) {
                            this.vy = 0;
                            this.vx *= 0.95; // Continue rolling slowly
                        }
                    }
                }
                
                // Off screen
                if (this.x < 0 || this.x > canvas.width || this.y > canvas.height) {
                    this.active = false;
                }
            }
            
            explode() {
                this.active = false;
                createExplosion(this.x, this.y, 50);
                gameState.cameraShake = 10;
            }
        }
        
        // Explosion class
        class Explosion {
            constructor(x, y, radius) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.maxRadius = radius;
                this.currentRadius = 0;
                this.active = true;
                this.phase = 'expand';
            }
            
            draw() {
                const alpha = 1 - (this.currentRadius / this.maxRadius);
                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.currentRadius);
                gradient.addColorStop(0, `rgba(255, 200, 0, ${alpha})`);
                gradient.addColorStop(0.5, `rgba(255, 100, 0, ${alpha * 0.8})`);
                gradient.addColorStop(1, `rgba(255, 0, 0, 0)`);
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.currentRadius, 0, Math.PI * 2);
                ctx.fill();
            }
            
            update() {
                if (this.phase === 'expand') {
                    this.currentRadius += 3;
                    if (this.currentRadius >= this.maxRadius) {
                        this.phase = 'fade';
                    }
                } else {
                    this.currentRadius += 1;
                    if (this.currentRadius >= this.maxRadius * 1.5) {
                        this.active = false;
                    }
                }
            }
        }
        
        // Terrain generation
        function generateTerrain() {
            gameState.terrain = [];
            let y = canvas.height * 0.7;
            
            for (let x = 0; x < canvas.width; x += 5) {
                y += (Math.random() - 0.5) * 10;
                y = Math.max(canvas.height * 0.4, Math.min(canvas.height * 0.9, y));
                gameState.terrain.push({ x, y });
            }
        }
        
        function drawTerrain() {
            ctx.fillStyle = '#2d5016';
            ctx.beginPath();
            ctx.moveTo(0, canvas.height);
            
            for (let point of gameState.terrain) {
                ctx.lineTo(point.x, point.y);
            }
            
            ctx.lineTo(canvas.width, canvas.height);
            ctx.closePath();
            ctx.fill();
            
            // Grass on top
            ctx.strokeStyle = '#3d6b1f';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, gameState.terrain[0].y);
            for (let point of gameState.terrain) {
                ctx.lineTo(point.x, point.y);
            }
            ctx.stroke();
        }
        
        function findTerrainY(x) {
            const index = Math.floor(x / 5);
            if (index < 0) return canvas.height;
            if (index >= gameState.terrain.length - 1) return canvas.height;
            
            const p1 = gameState.terrain[index];
            const p2 = gameState.terrain[index + 1];
            const t = (x - p1.x) / (p2.x - p1.x);
            return p1.y + (p2.y - p1.y) * t;
        }
        
        function isOnTerrain(x, y) {
            const terrainY = findTerrainY(x);
            return y >= terrainY;
        }
        
        function destroyTerrain(x, y, radius) {
            for (let point of gameState.terrain) {
                const dx = point.x - x;
                const dy = point.y - y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < radius) {
                    point.y += (radius - dist) * 0.5;
                    if (point.y > canvas.height) point.y = canvas.height;
                }
            }
        }
        
        function createExplosion(x, y, radius) {
            gameState.explosions.push(new Explosion(x, y, radius));
            destroyTerrain(x, y, radius);
            
            // Damage worms
            for (let worm of gameState.worms) {
                if (!worm.alive) continue;
                
                const dx = worm.x - x;
                const dy = worm.y - y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < radius) {
                    const damage = Math.floor((1 - dist / radius) * 50);
                    worm.takeDamage(damage, x, y);
                }
            }
        }
        
        function createAirstrike(x) {
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const offsetX = x + (i - 2) * 30;
                    const projectile = new Projectile(offsetX, -20, 270, 20, 'bazooka');
                    gameState.projectiles.push(projectile);
                }, i * 200);
            }
        }
        
        // Initialize game
        function initGame() {
            // Reset all form controls to defaults
            document.getElementById('weapon').value = 'bazooka';
            document.getElementById('angle').value = 45;
            document.getElementById('angleValue').textContent = 45;
            
            generateTerrain();
            gameState.worms = [];
            gameState.projectiles = [];
            gameState.explosions = [];
            gameState.currentTeam = 1;
            gameState.team1WormIndex = 0;
            gameState.team2WormIndex = 0;
            gameState.hasFiredThisTurn = false;
            gameState.wind = Math.random() * 10 - 5;
            
            // Spawn worms with more random placement
            for (let i = 0; i < 3; i++) {
                // Team 1 worms on the left side with random positioning
                const x1 = 80 + Math.random() * 300;
                const y1 = findTerrainY(x1) - 20;
                gameState.worms.push(new Worm(x1, y1, 1));
                
                // Team 2 worms on the right side with random positioning
                const x2 = canvas.width - 80 - Math.random() * 300;
                const y2 = findTerrainY(x2) - 20;
                gameState.worms.push(new Worm(x2, y2, 2));
            }
            
            updateUI();
        }
        
        function getActiveWorm() {
            const currentTeamWorms = gameState.worms.filter(w => w.alive && w.team === gameState.currentTeam);
            if (currentTeamWorms.length === 0) return null;
            
            const wormIndex = gameState.currentTeam === 1 ? gameState.team1WormIndex : gameState.team2WormIndex;
            // Make sure index is within bounds
            const safeIndex = wormIndex % currentTeamWorms.length;
            return currentTeamWorms[safeIndex];
        }
        
        function updateAngleControl(worm) {
            if (!worm) return;
            
            // Restore worm's last settings
            document.getElementById('angle').value = worm.lastAngle;
            document.getElementById('angleValue').textContent = worm.lastAngle;
        }
        
        function showSpeech(x, y, text) {
            const bubble = document.getElementById('speechBubble');
            const rect = canvas.getBoundingClientRect();
            bubble.textContent = text;
            bubble.style.display = 'block';
            bubble.style.left = (rect.left + x) + 'px';
            bubble.style.top = (rect.top + y) + 'px';
            
            setTimeout(() => {
                bubble.style.display = 'none';
            }, 1500);
        }
        
        function getValidAngleRange(worm) {
            if (!worm) return { min: 0, max: 180 };
            
            if (worm.facing === 'right') {
                return { min: 0, max: 90 };
            } else {
                return { min: 90, max: 180 };
            }
        }
        
        // Power charging logic
        function updatePowerCharge() {
            if (!gameState.chargingPower) return;
            
            const speed = 1; // Speed of power change (50% slower than before)
            
            if (gameState.powerPhase === 0) {
                // 50% -> 0%
                gameState.powerCharge -= speed;
                if (gameState.powerCharge <= 0) {
                    gameState.powerCharge = 0;
                    gameState.powerPhase = 1;
                }
            } else if (gameState.powerPhase === 1) {
                // 0% -> 100%
                gameState.powerCharge += speed;
                if (gameState.powerCharge >= 100) {
                    gameState.powerCharge = 100;
                    gameState.powerPhase = 2;
                }
            } else if (gameState.powerPhase === 2) {
                // 100% -> 0%
                gameState.powerCharge -= speed;
                if (gameState.powerCharge <= 0) {
                    gameState.powerCharge = 0;
                    gameState.powerPhase = 3;
                }
            } else if (gameState.powerPhase === 3) {
                // 0% -> 100%
                gameState.powerCharge += speed;
                if (gameState.powerCharge >= 100) {
                    gameState.powerCharge = 100;
                    gameState.powerPhase = 2; // Loop between phases 2 and 3
                }
            }
        }
        
        function startCharging() {
            const worm = getActiveWorm();
            if (!worm || gameState.isAnimating || gameState.chargingPower || gameState.hasFiredThisTurn) return;
            
            gameState.chargingPower = true;
            gameState.powerCharge = 50;
            gameState.powerPhase = 0;
        }
        
        function releaseFire() {
            if (!gameState.chargingPower || gameState.hasFiredThisTurn) return;
            
            gameState.chargingPower = false;
            const worm = getActiveWorm();
            if (!worm || gameState.isAnimating) return;
            
            const angle = parseInt(document.getElementById('angle').value);
            const power = Math.max(10, Math.floor(gameState.powerCharge));
            const weapon = document.getElementById('weapon').value;
            
            // Validate angle based on facing direction
            const validRange = getValidAngleRange(worm);
            if (angle < validRange.min || angle > validRange.max) {
                return;
            }
            
            // Save worm's settings
            worm.lastAngle = angle;
            worm.lastPower = power;
            
            // Mark that we've fired this turn
            gameState.hasFiredThisTurn = true;
            
            // Show speech
            showSpeech(worm.x, worm.y - 30, fireMessages[Math.floor(Math.random() * fireMessages.length)]);
            
            gameState.isAnimating = true;
            
            if (weapon === 'airstrike') {
                createAirstrike(worm.x);
            } else {
                const projectile = new Projectile(worm.x, worm.y, angle, power, weapon);
                gameState.projectiles.push(projectile);
            }
        }
        
        function nextTurn() {
            // Randomize wind every turn
            gameState.wind = Math.random() * 10 - 5;
            
            // Reset fired flag for new turn
            gameState.hasFiredThisTurn = false;
            
            // Advance the worm index for the current team BEFORE switching
            if (gameState.currentTeam === 1) {
                gameState.team1WormIndex++;
            } else {
                gameState.team2WormIndex++;
            }
            
            // Switch to the other team
            gameState.currentTeam = gameState.currentTeam === 1 ? 2 : 1;
            
            // Check win condition first
            const team1Alive = gameState.worms.filter(w => w.alive && w.team === 1).length;
            const team2Alive = gameState.worms.filter(w => w.alive && w.team === 2).length;
            
            if (team1Alive === 0 && team2Alive > 0) {
                setTimeout(() => {
                    alert('Green Team Wins!');
                }, 500);
                return;
            } else if (team2Alive === 0 && team1Alive > 0) {
                setTimeout(() => {
                    alert('Red Team Wins!');
                }, 500);
                return;
            }
            
            updateAngleControl(getActiveWorm());
            updateUI();
        }
        
        function updateUI() {
            const activeWorm = getActiveWorm();
            const currentTeamWorms = gameState.worms.filter(w => w.alive && w.team === gameState.currentTeam);
            const wormIndex = gameState.currentTeam === 1 ? gameState.team1WormIndex : gameState.team2WormIndex;
            const wormNumber = (wormIndex % Math.max(1, currentTeamWorms.length)) + 1;
            
            document.getElementById('currentTeam').textContent = `Team ${gameState.currentTeam} - Worm ${wormNumber}`;
            document.getElementById('windDisplay').textContent = gameState.wind.toFixed(1);
            
            // Visual wind indicator with arrows
            const windStrength = Math.abs(gameState.wind);
            const windDirection = gameState.wind > 0 ? '→' : '←';
            let windArrows = '';
            if (windStrength < 2) {
                windArrows = windDirection;
            } else if (windStrength < 3.5) {
                windArrows = windDirection + windDirection;
            } else {
                windArrows = windDirection + windDirection + windDirection;
            }
            document.getElementById('windIndicator').textContent = windArrows;
            
            document.getElementById('team1Worms').textContent = gameState.worms.filter(w => w.alive && w.team === 1).length;
            document.getElementById('team2Worms').textContent = gameState.worms.filter(w => w.alive && w.team === 2).length;
        }
        
        // Keyboard controls
        const keys = {};
        
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Spacebar') {
                e.preventDefault();
                if (!keys[' ']) {
                    startCharging();
                }
                keys[' '] = true;
                return;
            }
            
            // Prevent default for arrow keys to avoid page scrolling
            if (e.key.startsWith('Arrow')) {
                e.preventDefault();
                keys[e.key] = true;
            }
        });
        
        document.addEventListener('keyup', (e) => {
            if (e.key === ' ' || e.key === 'Spacebar') {
                e.preventDefault();
                releaseFire();
                keys[' '] = false;
                return;
            }
            
            if (e.key.startsWith('Arrow')) {
                e.preventDefault();
                keys[e.key] = false;
            }
        });
        
        // Process arrow key movements every frame
        function processArrowKeyMovement() {
            const worm = getActiveWorm();
            if (!worm || gameState.isAnimating) return;
            
            const angleInput = document.getElementById('angle');
            const validRange = getValidAngleRange(worm);
            const angleIncrement = worm.facing === 'right' ? 1 : -1;
            
            if (keys['ArrowUp']) {
                let newAngle = parseInt(angleInput.value) + angleIncrement;
                newAngle = Math.min(validRange.max, Math.max(validRange.min, newAngle));
                angleInput.value = newAngle;
                document.getElementById('angleValue').textContent = newAngle;
                worm.lastAngle = newAngle;
            }
            
            if (keys['ArrowDown']) {
                let newAngle = parseInt(angleInput.value) - angleIncrement;
                newAngle = Math.min(validRange.max, Math.max(validRange.min, newAngle));
                angleInput.value = newAngle;
                document.getElementById('angleValue').textContent = newAngle;
                worm.lastAngle = newAngle;
            }
            
            if (keys['ArrowLeft']) {
                worm.move('left');
                // Update angle range when facing changes
                const newRange = getValidAngleRange(worm);
                let currentAngle = parseInt(angleInput.value);
                if (currentAngle < newRange.min || currentAngle > newRange.max) {
                    currentAngle = 135; // Default left-facing angle
                    angleInput.value = currentAngle;
                    document.getElementById('angleValue').textContent = currentAngle;
                    worm.lastAngle = currentAngle;
                }
            }
            
            if (keys['ArrowRight']) {
                worm.move('right');
                // Update angle range when facing changes
                const newRange = getValidAngleRange(worm);
                let currentAngle = parseInt(angleInput.value);
                if (currentAngle < newRange.min || currentAngle > newRange.max) {
                    currentAngle = 45; // Default right-facing angle
                    angleInput.value = currentAngle;
                    document.getElementById('angleValue').textContent = currentAngle;
                    worm.lastAngle = currentAngle;
                }
            }
        }
        
        // Touch/Mouse controls
        function handleMove(direction) {
            const worm = getActiveWorm();
            if (!worm || gameState.isAnimating) return;
            
            const angleInput = document.getElementById('angle');
            const newRange = getValidAngleRange(worm);
            let currentAngle = parseInt(angleInput.value);
            
            worm.move(direction);
            
            if (currentAngle < newRange.min || currentAngle > newRange.max) {
                currentAngle = direction === 'left' ? 135 : 45;
                angleInput.value = currentAngle;
                document.getElementById('angleValue').textContent = currentAngle;
                worm.lastAngle = currentAngle;
            }
        }
        
        function handleAngleChange(increment) {
            const worm = getActiveWorm();
            if (!worm || gameState.isAnimating) return;
            
            const angleInput = document.getElementById('angle');
            const validRange = getValidAngleRange(worm);
            const angleIncrement = worm.facing === 'right' ? increment : -increment;
            
            let newAngle = parseInt(angleInput.value) + angleIncrement;
            newAngle = Math.min(validRange.max, Math.max(validRange.min, newAngle));
            angleInput.value = newAngle;
            document.getElementById('angleValue').textContent = newAngle;
            worm.lastAngle = newAngle;
        }
        
        // Touch button events
        ['touchstart', 'mousedown'].forEach(eventType => {
            document.getElementById('touchLeft').addEventListener(eventType, (e) => {
                e.preventDefault();
                handleMove('left');
            });
            
            document.getElementById('touchRight').addEventListener(eventType, (e) => {
                e.preventDefault();
                handleMove('right');
            });
            
            document.getElementById('touchUp').addEventListener(eventType, (e) => {
                e.preventDefault();
                handleAngleChange(1);
            });
            
            document.getElementById('touchDown').addEventListener(eventType, (e) => {
                e.preventDefault();
                handleAngleChange(-1);
            });
            
            document.getElementById('touchFire').addEventListener(eventType, (e) => {
                e.preventDefault();
                startCharging();
            });
        });
        
        ['touchend', 'mouseup'].forEach(eventType => {
            document.getElementById('touchFire').addEventListener(eventType, (e) => {
                e.preventDefault();
                releaseFire();
            });
        });
        
        // Controls
        document.getElementById('angle').addEventListener('input', (e) => {
            const worm = getActiveWorm();
            if (worm) {
                const validRange = getValidAngleRange(worm);
                let angle = parseInt(e.target.value);
                angle = Math.max(validRange.min, Math.min(validRange.max, angle));
                e.target.value = angle;
                document.getElementById('angleValue').textContent = angle;
                worm.lastAngle = angle;
            } else {
                document.getElementById('angleValue').textContent = e.target.value;
            }
        });
        
        document.getElementById('newGameBtn').addEventListener('click', () => {
            initGame();
            updateAngleControl(getActiveWorm());
        });
        
        // Process continuous key movements every frame
        function processArrowKeyMovement() {
            const worm = getActiveWorm();
            if (!worm || gameState.hasFiredThisTurn) return; // Can't move after firing is complete
            
            const angleInput = document.getElementById('angle');
            const validRange = getValidAngleRange(worm);
            const angleIncrement = worm.facing === 'right' ? 1 : -1;
            
            if (keys['ArrowUp']) {
                let newAngle = parseInt(angleInput.value) + angleIncrement;
                newAngle = Math.min(validRange.max, Math.max(validRange.min, newAngle));
                angleInput.value = newAngle;
                document.getElementById('angleValue').textContent = newAngle;
                worm.lastAngle = newAngle;
            }
            
            if (keys['ArrowDown']) {
                let newAngle = parseInt(angleInput.value) - angleIncrement;
                newAngle = Math.min(validRange.max, Math.max(validRange.min, newAngle));
                angleInput.value = newAngle;
                document.getElementById('angleValue').textContent = newAngle;
                worm.lastAngle = newAngle;
            }
            
            if (keys['ArrowLeft']) {
                worm.move('left');
                // Update angle range when facing changes
                const newRange = getValidAngleRange(worm);
                let currentAngle = parseInt(angleInput.value);
                if (currentAngle < newRange.min || currentAngle > newRange.max) {
                    currentAngle = 135; // Default left-facing angle
                    angleInput.value = currentAngle;
                    document.getElementById('angleValue').textContent = currentAngle;
                    worm.lastAngle = currentAngle;
                }
            }
            
            if (keys['ArrowRight']) {
                worm.move('right');
                // Update angle range when facing changes
                const newRange = getValidAngleRange(worm);
                let currentAngle = parseInt(angleInput.value);
                if (currentAngle < newRange.min || currentAngle > newRange.max) {
                    currentAngle = 45; // Default right-facing angle
                    angleInput.value = currentAngle;
                    document.getElementById('angleValue').textContent = currentAngle;
                    worm.lastAngle = currentAngle;
                }
            }
        }
        
        function endTurn() {
            gameState.isAnimating = false;
            gameState.chargingPower = false;
            nextTurn();
        }
        
        // Game loop
        function gameLoop() {
            // Process continuous key movements
            processArrowKeyMovement();
            
            // Update power charge
            updatePowerCharge();
            
            // Camera shake
            ctx.save();
            if (gameState.cameraShake > 0) {
                const shakeX = (Math.random() - 0.5) * gameState.cameraShake;
                const shakeY = (Math.random() - 0.5) * gameState.cameraShake;
                ctx.translate(shakeX, shakeY);
                gameState.cameraShake *= 0.9;
                if (gameState.cameraShake < 0.1) gameState.cameraShake = 0;
            }
            
            // Clear
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw terrain
            drawTerrain();
            
            // Update and draw projectiles
            for (let i = gameState.projectiles.length - 1; i >= 0; i--) {
                const proj = gameState.projectiles[i];
                proj.update();
                proj.draw();
                if (!proj.active) {
                    gameState.projectiles.splice(i, 1);
                }
            }
            
            // Update and draw explosions
            for (let i = gameState.explosions.length - 1; i >= 0; i--) {
                const exp = gameState.explosions[i];
                exp.update();
                exp.draw();
                if (!exp.active) {
                    gameState.explosions.splice(i, 1);
                }
            }
            
            // Update and draw worms
            for (let worm of gameState.worms) {
                worm.update();
                worm.draw();
            }
            
            // Draw aim indicator for active worm
            const activeWorm = getActiveWorm();
            if (activeWorm && !gameState.hasFiredThisTurn) {
                const angle = parseInt(document.getElementById('angle').value);
                const power = gameState.chargingPower ? gameState.powerCharge : 50;
                const rad = (angle * Math.PI) / 180;
                const length = power;
                
                // Color based on power
                let color;
                if (power < 30) {
                    color = 'rgba(255, 100, 100, 0.8)';
                } else if (power < 70) {
                    color = 'rgba(255, 255, 100, 0.8)';
                } else {
                    color = 'rgba(100, 255, 100, 0.8)';
                }
                
                ctx.strokeStyle = gameState.chargingPower ? color : 'rgba(255, 255, 255, 0.8)';
                ctx.lineWidth = gameState.chargingPower ? 4 : 2;
                ctx.beginPath();
                ctx.moveTo(activeWorm.x, activeWorm.y);
                ctx.lineTo(
                    activeWorm.x + Math.cos(rad) * length,
                    activeWorm.y - Math.sin(rad) * length
                );
                ctx.stroke();
                
                // Arrow head
                const arrowSize = 10;
                const endX = activeWorm.x + Math.cos(rad) * length;
                const endY = activeWorm.y - Math.sin(rad) * length;
                ctx.fillStyle = gameState.chargingPower ? color : 'white';
                ctx.beginPath();
                ctx.moveTo(endX, endY);
                ctx.lineTo(
                    endX - arrowSize * Math.cos(rad - Math.PI / 6),
                    endY + arrowSize * Math.sin(rad - Math.PI / 6)
                );
                ctx.lineTo(
                    endX - arrowSize * Math.cos(rad + Math.PI / 6),
                    endY + arrowSize * Math.sin(rad + Math.PI / 6)
                );
                ctx.closePath();
                ctx.fill();
                
                // Show power percentage
                if (gameState.chargingPower) {
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 16px Arial';
                    ctx.fillText(Math.floor(power) + '%', activeWorm.x + 15, activeWorm.y - 25);
                }
            }
            
            ctx.restore();
            
            // Check if turn should end (after firing)
            if (gameState.isAnimating && gameState.hasFiredThisTurn &&
                gameState.projectiles.length === 0 && 
                gameState.explosions.length === 0 &&
                gameState.worms.filter(w => w.alive).every(w => Math.abs(w.vx) < 0.1 && Math.abs(w.vy) < 0.1)) {
                endTurn();
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        // Start game
        initGame();
        updateAngleControl(getActiveWorm());
        gameLoop();
    </script>
</body>
</html>
