<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Triangle & Circle Adventure</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        font-family: Arial, sans-serif;
      }

      #gameContainer {
        text-align: center;
      }

      canvas {
        border: 4px solid #fff;
        background: #2d3436;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }

      #info {
        color: white;
        margin-top: 20px;
        font-size: 18px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      }

      #controls {
        color: white;
        margin-top: 10px;
        font-size: 14px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      }

      .win-message {
        color: #ffd700;
        font-size: 24px;
        font-weight: bold;
        margin-top: 10px;
      }

      #score {
        color: white;
        margin-top: 10px;
        font-size: 16px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      }
    </style>
  </head>
  <body>
    <div id="gameContainer">
      <canvas id="gameCanvas" width="800" height="600"></canvas>
      <div id="info">Race to the portal!</div>
      <div id="score">Triangle: 0 | Circle: 0</div>
      <div id="controls">
        Triangle: WASD | Circle: Arrow Keys | R: Reset Level
      </div>
    </div>

    <script>
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const info = document.getElementById('info');
      const scoreDisplay = document.getElementById('score');

      // Game state
      let currentLevel = 0;
      let gameWon = false;
      let winner = null;
      let triangleScore = 0;
      let circleScore = 0;

      // Player 1 - Triangle
      const triangle = {
        x: 100,
        y: 450,
        width: 30,
        height: 30,
        speed: 4,
        velocityY: 0,
        gravity: 0.6,
        jumpPower: -12,
        onGround: false,
        color: '#e74c3c',
      };

      // Player 2 - Circle
      const circle = {
        x: 150,
        y: 450,
        radius: 15,
        speed: 4,
        velocityY: 0,
        gravity: 0.6,
        jumpPower: -12,
        onGround: false,
        color: '#3498db',
      };

      // Portal
      const portal = {
        x: 700,
        y: 100,
        width: 50,
        height: 80,
        rotation: 0,
      };

      // Keys pressed
      const keys = {};

      // Level platforms
      const levels = [
        // Level 1 - Simple introduction
        {
          platforms: [
            { x: 0, y: 500, width: 300, height: 100, color: '#34495e' },
            { x: 350, y: 400, width: 150, height: 100, color: '#34495e' },
            { x: 550, y: 300, width: 250, height: 100, color: '#34495e' },
            { x: 200, y: 250, width: 150, height: 20, color: '#34495e' },
          ],
          portal: { x: 700, y: 200 },
          triangle: { x: 100, y: 450 },
          circle: { x: 150, y: 450 },
        },
        // Level 2 - Timing and competition
        {
          platforms: [
            { x: 0, y: 500, width: 200, height: 100, color: '#34495e' },
            { x: 600, y: 500, width: 200, height: 100, color: '#34495e' },
            { x: 250, y: 400, width: 80, height: 20, color: '#34495e' },
            { x: 470, y: 400, width: 80, height: 20, color: '#34495e' },
            { x: 360, y: 320, width: 80, height: 20, color: '#34495e' },
            { x: 150, y: 240, width: 100, height: 20, color: '#34495e' },
            { x: 550, y: 200, width: 100, height: 20, color: '#34495e' },
            { x: 300, y: 150, width: 200, height: 20, color: '#34495e' },
          ],
          portal: { x: 180, y: 140 },
          triangle: { x: 50, y: 450 },
          circle: { x: 700, y: 450 },
        },
        // Level 3 - Separated paths
        {
          platforms: [
            { x: 0, y: 550, width: 150, height: 50, color: '#34495e' },
            { x: 650, y: 550, width: 150, height: 50, color: '#34495e' },
            { x: 50, y: 450, width: 80, height: 20, color: '#34495e' },
            { x: 50, y: 350, width: 80, height: 20, color: '#34495e' },
            { x: 50, y: 250, width: 80, height: 20, color: '#34495e' },
            { x: 670, y: 450, width: 80, height: 20, color: '#34495e' },
            { x: 670, y: 350, width: 80, height: 20, color: '#34495e' },
            { x: 670, y: 250, width: 80, height: 20, color: '#34495e' },
            { x: 200, y: 180, width: 80, height: 20, color: '#34495e' },
            { x: 520, y: 180, width: 80, height: 20, color: '#34495e' },
            { x: 350, y: 120, width: 100, height: 20, color: '#34495e' },
          ],
          portal: { x: 370, y: 20 },
          triangle: { x: 75, y: 500 },
          circle: { x: 725, y: 500 },
        },
        // Level 4 - Narrow platforms
        {
          platforms: [
            { x: 0, y: 560, width: 120, height: 40, color: '#34495e' },
            { x: 680, y: 560, width: 120, height: 40, color: '#34495e' },
            { x: 140, y: 480, width: 80, height: 15, color: '#34495e' },
            { x: 260, y: 420, width: 80, height: 15, color: '#34495e' },
            { x: 380, y: 360, width: 80, height: 15, color: '#34495e' },
            { x: 500, y: 420, width: 80, height: 15, color: '#34495e' },
            { x: 620, y: 480, width: 80, height: 15, color: '#34495e' },
            { x: 180, y: 300, width: 90, height: 15, color: '#34495e' },
            { x: 530, y: 300, width: 90, height: 15, color: '#34495e' },
            { x: 340, y: 220, width: 120, height: 15, color: '#34495e' },
            { x: 100, y: 140, width: 100, height: 15, color: '#34495e' },
            { x: 600, y: 140, width: 100, height: 15, color: '#34495e' },
            { x: 340, y: 60, width: 120, height: 15, color: '#34495e' },
          ],
          portal: { x: 375, y: -40 },
          triangle: { x: 50, y: 520 },
          circle: { x: 730, y: 520 },
        },
        // Level 5 - The gauntlet
        {
          platforms: [
            { x: 0, y: 570, width: 80, height: 30, color: '#34495e' },
            { x: 720, y: 570, width: 80, height: 30, color: '#34495e' },
            { x: 120, y: 510, width: 50, height: 15, color: '#34495e' },
            { x: 630, y: 510, width: 50, height: 15, color: '#34495e' },
            { x: 210, y: 450, width: 50, height: 15, color: '#34495e' },
            { x: 540, y: 450, width: 50, height: 15, color: '#34495e' },
            { x: 300, y: 390, width: 50, height: 15, color: '#34495e' },
            { x: 450, y: 390, width: 50, height: 15, color: '#34495e' },
            { x: 375, y: 320, width: 50, height: 15, color: '#34495e' },
            { x: 250, y: 260, width: 60, height: 15, color: '#34495e' },
            { x: 490, y: 260, width: 60, height: 15, color: '#34495e' },
            { x: 150, y: 190, width: 70, height: 15, color: '#34495e' },
            { x: 580, y: 190, width: 70, height: 15, color: '#34495e' },
            { x: 340, y: 120, width: 120, height: 15, color: '#34495e' },
            { x: 200, y: 50, width: 80, height: 15, color: '#34495e' },
            { x: 520, y: 50, width: 80, height: 15, color: '#34495e' },
          ],
          portal: { x: 360, y: -50 },
          triangle: { x: 40, y: 540 },
          circle: { x: 760, y: 540 },
        },
      ];

      let platforms = [];

      // Event listeners
      document.addEventListener('keydown', (e) => {
        keys[e.key.toLowerCase()] = true;

        // Jump controls
        if ((e.key === 'w' || e.key === 'W') && triangle.onGround) {
          triangle.velocityY = triangle.jumpPower;
          triangle.onGround = false;
        }
        if (e.key === 'ArrowUp' && circle.onGround) {
          circle.velocityY = circle.jumpPower;
          circle.onGround = false;
        }

        // Reset level
        if (e.key === 'r' || e.key === 'R') {
          resetLevel();
        }
      });

      document.addEventListener('keyup', (e) => {
        keys[e.key.toLowerCase()] = false;
      });

      function loadLevel(levelIndex) {
        const level = levels[levelIndex];
        platforms = level.platforms;
        portal.x = level.portal.x;
        portal.y = level.portal.y;
        triangle.x = level.triangle.x;
        triangle.y = level.triangle.y;
        triangle.spawnX = level.triangle.x;
        triangle.spawnY = level.triangle.y;
        triangle.velocityY = 0;
        circle.x = level.circle.x;
        circle.y = level.circle.y;
        circle.spawnX = level.circle.x;
        circle.spawnY = level.circle.y;
        circle.velocityY = 0;
        gameWon = false;
        winner = null;
      }

      function resetLevel() {
        loadLevel(currentLevel);
      }

      function nextLevel() {
        currentLevel++;
        if (currentLevel >= levels.length) {
          currentLevel = 0;
          info.innerHTML =
            '<span class="win-message">🎉 All levels complete! 🎉</span><br>Press R to play again';
        } else {
          info.textContent = `Level ${currentLevel + 1} - Race to the portal!`;
        }
        loadLevel(currentLevel);
      }

      function drawTriangle(x, y, size, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(x, y - size / 2);
        ctx.lineTo(x - size / 2, y + size / 2);
        ctx.lineTo(x + size / 2, y + size / 2);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      function drawCircle(x, y, radius, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      function drawStar(x, y, size, rotation) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);
        ctx.fillStyle = '#ffd700';
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
          ctx.lineTo(
            Math.cos(((18 + i * 72) * Math.PI) / 180) * size,
            -Math.sin(((18 + i * 72) * Math.PI) / 180) * size,
          );
          ctx.lineTo(
            (Math.cos(((54 + i * 72) * Math.PI) / 180) * size) / 2,
            (-Math.sin(((54 + i * 72) * Math.PI) / 180) * size) / 2,
          );
        }
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
      }

      function drawPortal(x, y, width, height, rotation) {
        ctx.save();
        ctx.translate(x + width / 2, y + height / 2);

        // Outer glow
        const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, width);
        gradient.addColorStop(0, 'rgba(138, 43, 226, 0.8)');
        gradient.addColorStop(0.5, 'rgba(75, 0, 130, 0.6)');
        gradient.addColorStop(1, 'rgba(75, 0, 130, 0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(-width, -height, width * 2, height * 2);

        // Portal ellipse
        ctx.rotate(rotation);
        ctx.fillStyle = '#8a2be2';
        ctx.beginPath();
        ctx.ellipse(0, 0, width / 2, height / 2, 0, 0, Math.PI * 2);
        ctx.fill();

        // Inner ellipse
        ctx.fillStyle = '#9370db';
        ctx.beginPath();
        ctx.ellipse(0, 0, width / 3, height / 3, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function checkCollision(rect1, rect2) {
        return (
          rect1.x < rect2.x + rect2.width &&
          rect1.x + rect1.width > rect2.x &&
          rect1.y < rect2.y + rect2.height &&
          rect1.y + rect1.height > rect2.y
        );
      }

      function checkCircleRectCollision(circle, rect) {
        const closestX = Math.max(
          rect.x,
          Math.min(circle.x, rect.x + rect.width),
        );
        const closestY = Math.max(
          rect.y,
          Math.min(circle.y, rect.y + rect.height),
        );
        const distanceX = circle.x - closestX;
        const distanceY = circle.y - closestY;
        return (
          distanceX * distanceX + distanceY * distanceY <
          circle.radius * circle.radius
        );
      }

      function updatePlayer(player, isCircle = false) {
        const oldX = player.x;
        const oldY = player.y;

        // Horizontal movement
        if (!isCircle) {
          if (keys['a']) player.x -= player.speed;
          if (keys['d']) player.x += player.speed;
        } else {
          if (keys['arrowleft']) player.x -= player.speed;
          if (keys['arrowright']) player.x += player.speed;
        }

        // Check horizontal collisions
        platforms.forEach((platform) => {
          let collision = false;

          if (isCircle) {
            collision = checkCircleRectCollision(player, platform);
          } else {
            const playerRect = {
              x: player.x - player.width / 2,
              y: player.y - player.height / 2,
              width: player.width,
              height: player.height,
            };
            collision = checkCollision(playerRect, platform);
          }

          if (collision) {
            player.x = oldX; // Revert horizontal movement
          }
        });

        // Apply gravity
        player.velocityY += player.gravity;
        player.y += player.velocityY;

        // Ground collision
        player.onGround = false;

        // Platform collision (vertical)
        platforms.forEach((platform) => {
          let collision = false;

          if (isCircle) {
            collision = checkCircleRectCollision(player, platform);

            if (collision) {
              // Landing on top
              if (player.velocityY > 0 && oldY + player.radius <= platform.y) {
                player.y = platform.y - player.radius;
                player.velocityY = 0;
                player.onGround = true;
              }
              // Hitting from below
              else if (
                player.velocityY < 0 &&
                oldY - player.radius >= platform.y + platform.height
              ) {
                player.y = platform.y + platform.height + player.radius;
                player.velocityY = 0;
              }
            }
          } else {
            const playerRect = {
              x: player.x - player.width / 2,
              y: player.y - player.height / 2,
              width: player.width,
              height: player.height,
            };

            collision = checkCollision(playerRect, platform);

            if (collision) {
              // Landing on top
              if (
                player.velocityY > 0 &&
                oldY + player.height / 2 <= platform.y
              ) {
                player.y = platform.y - player.height / 2;
                player.velocityY = 0;
                player.onGround = true;
              }
              // Hitting from below
              else if (
                player.velocityY < 0 &&
                oldY - player.height / 2 >= platform.y + platform.height
              ) {
                player.y = platform.y + platform.height + player.height / 2;
                player.velocityY = 0;
              }
            }
          }
        });

        // Screen boundaries
        if (!isCircle) {
          player.x = Math.max(
            player.width / 2,
            Math.min(canvas.width - player.width / 2, player.x),
          );
        } else {
          player.x = Math.max(
            player.radius,
            Math.min(canvas.width - player.radius, player.x),
          );
        }

        // Fall off screen - respawn individual player
        if (player.y > canvas.height + 100) {
          player.x = player.spawnX;
          player.y = player.spawnY;
          player.velocityY = 0;
        }
      }

      function checkPortalEntry() {
        if (gameWon) return;

        const portalRect = {
          x: portal.x,
          y: portal.y,
          width: portal.width,
          height: portal.height,
        };

        // Check which player reaches portal first
        const triangleRect = {
          x: triangle.x - triangle.width / 2,
          y: triangle.y - triangle.height / 2,
          width: triangle.width,
          height: triangle.height,
        };

        const triangleInPortal = checkCollision(triangleRect, portalRect);
        const circleInPortal = checkCircleRectCollision(circle, portalRect);

        if (triangleInPortal || circleInPortal) {
          gameWon = true;
          if (triangleInPortal) {
            winner = 'Triangle';
            triangleScore++;
          } else {
            winner = 'Circle';
            circleScore++;
          }
          updateScoreDisplay();
          setTimeout(() => {
            nextLevel();
          }, 1500);
        }
      }

      function updateScoreDisplay() {
        scoreDisplay.textContent = `Triangle: ${triangleScore} | Circle: ${circleScore}`;
      }

      function update() {
        if (!gameWon) {
          updatePlayer(triangle, false);
          updatePlayer(circle, true);
          checkPortalEntry();
        }
      }

      function draw() {
        // Clear canvas
        ctx.fillStyle = '#2d3436';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw platforms
        platforms.forEach((platform) => {
          ctx.fillStyle = platform.color;
          ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
          ctx.strokeStyle = '#7f8c8d';
          ctx.lineWidth = 2;
          ctx.strokeRect(
            platform.x,
            platform.y,
            platform.width,
            platform.height,
          );
        });

        // Draw portal
        portal.rotation += 0.02;
        drawPortal(
          portal.x,
          portal.y,
          portal.width,
          portal.height,
          portal.rotation,
        );

        // Draw players
        drawTriangle(triangle.x, triangle.y, triangle.width, triangle.color);
        drawCircle(circle.x, circle.y, circle.radius, circle.color);

        // Draw level indicator
        ctx.fillStyle = '#fff';
        ctx.font = '20px Arial';
        ctx.fillText(`Level ${currentLevel + 1}`, 10, 30);

        // Win message
        if (gameWon && winner) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          const winnerColor = winner === 'Triangle' ? '#e74c3c' : '#3498db';
          ctx.fillStyle = winnerColor;
          ctx.font = '48px Arial';
          ctx.textAlign = 'center';
          ctx.fillText(`${winner} Wins!`, canvas.width / 2, canvas.height / 2);
          ctx.textAlign = 'left';
        }
      }

      function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
      }

      // Initialize game
      loadLevel(currentLevel);
      info.textContent = `Level ${currentLevel + 1} - Race to the portal!`;
      updateScoreDisplay();
      gameLoop();
    </script>
  </body>
</html>
